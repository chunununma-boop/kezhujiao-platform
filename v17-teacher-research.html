<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支点课堂 · 研究管理</title>
<style>
/* 令牌沿用 ClassNode 服务端下发的 --cn-* 变量，保证与教师控制台同一套视觉 */
:root{
  --cn-bg:#f4f6f8; --cn-surface:#ffffff; --cn-surface-subtle:#f8fafb; --cn-surface-muted:#edf2f6;
  --cn-text:#26333f; --cn-text-muted:#657382; --cn-placeholder:#8b97a3;
  --cn-primary:#466b8a; --cn-primary-hover:#3b5b76; --cn-primary-pressed:#304b62; --cn-primary-soft:#edf2f6;
  --cn-border:#d8e1e8; --cn-border-strong:#b9c9d6; --cn-focus:rgba(70,107,138,.18);
  --cn-success:#52745f; --cn-success-soft:#edf4ef; --cn-danger:#a95f58; --cn-danger-soft:#f9eeee;
  --cn-reward:#966b34; --cn-reward-soft:#fbf3e6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cn-bg);color:var(--cn-text);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cn-primary)}
.shell{display:flex;min-height:100vh}

/* 侧栏：展开 208px，收起 56px，与平台一致 */
.side{width:208px;flex:none;background:#e0e3e8;padding:14px 8px 18px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.side.mini{width:56px;padding:14px 4px 18px}
.brand{padding:0 8px 10px;font-weight:700;font-size:17px;line-height:1.25}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--cn-text-muted);letter-spacing:.04em}
.side.mini .brand{font-size:0;padding:0 0 10px}.side.mini .brand small{font-size:0}
.grp{margin:12px 8px 4px;font-size:14px;color:var(--cn-text-muted)}
.side.mini .grp{text-align:center;font-size:13px;margin:10px 0 4px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;font-size:14px;color:#334155;cursor:pointer}
.side.mini .nav{padding:9px 0;text-align:center;font-size:13px}
.nav:hover{background:rgba(255,255,255,.7)}
.nav.on{background:var(--cn-surface);color:var(--cn-primary);font-weight:600;box-shadow:inset 0 0 0 1px var(--cn-border)}
.nav.ext{color:var(--cn-text-muted)}
.side .foot{margin-top:auto;padding:10px 8px 0;display:flex;flex-direction:column;gap:6px}
.collapse{background:none;border:1px solid var(--cn-border);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--cn-text-muted);cursor:pointer}

main{flex:1;min-width:0;padding:20px 24px 60px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:24px;font-weight:700;margin:0}
.sub{color:var(--cn-text-muted);font-size:14px}
.bar .sp{flex:1}
.role{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--cn-text-muted)}
.role select{padding:5px 8px;border:1px solid var(--cn-border);border-radius:8px;background:var(--cn-surface)}
.save{font-size:14px;color:var(--cn-text-muted)}
.save.ok{color:var(--cn-success)} .save.bad{color:var(--cn-danger)}
.tasks{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--cn-text-muted)}
.tasks a,.tasks .now{padding:5px 9px;border:1px solid var(--cn-border);border-radius:8px;background:var(--cn-surface);text-decoration:none;color:var(--cn-text)}
.tasks .now{background:var(--cn-primary-soft);border-color:var(--cn-border-strong)}
.btn{border:1px solid var(--cn-border);background:var(--cn-surface);border-radius:8px;padding:7px 12px;font-size:15px;cursor:pointer}
.btn:hover{border-color:var(--cn-border-strong)}
.btn.pri{background:var(--cn-primary);border-color:var(--cn-primary);color:#fff}
.btn.pri:hover{background:var(--cn-primary-hover)}
.btn.sm{padding:4px 9px;font-size:14px}
.btn.dgr{color:var(--cn-danger);border-color:var(--cn-danger-soft);background:var(--cn-danger-soft)}
.btn:disabled{color:var(--cn-placeholder);background:var(--cn-surface-muted);border-color:var(--cn-border);cursor:not-allowed}
.card{background:var(--cn-surface);border:1px solid var(--cn-border);border-radius:12px;margin:0 0 20px}
.card>h2{margin:0;padding:12px 16px;font-size:16px;font-weight:600;border-bottom:1px solid var(--cn-surface-muted)}
.card>.bd{padding:16px;overflow-x:auto}
.card>.ft{padding:10px 16px;border-top:1px solid var(--cn-surface-muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label{display:block;font-size:14px;font-weight:600;color:var(--cn-text-muted);margin:10px 0 4px}
label:first-child{margin-top:0}
input[type=text],input[type=date],input[type=number],input[type=datetime-local],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--cn-border);border-radius:8px;background:var(--cn-surface);font-size:16px}
textarea{min-height:66px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--cn-surface-muted);color:var(--cn-text);cursor:not-allowed}
.chip:has(input:disabled){cursor:not-allowed;opacity:.75}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cn-primary);outline-offset:1px;box-shadow:0 0 0 4px var(--cn-focus)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--cn-border);border-radius:999px;padding:5px 11px;font-size:16px;background:var(--cn-surface-subtle)}
.chip input{width:auto;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rec{border:1px solid var(--cn-border);border-radius:10px;background:var(--cn-surface-subtle);margin:0 0 8px}
.rec>summary{list-style:none;cursor:pointer;padding:10px 13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px}
.rec>summary::-webkit-details-marker{display:none}
.rec>summary .t{font-weight:600}
.rec>.bd{padding:2px 13px 13px;border-top:1px solid var(--cn-border)}
.tag{font-size:13px;padding:2px 8px;border-radius:999px;background:var(--cn-surface-muted);color:var(--cn-text-muted)}
.tag.ok{background:var(--cn-success-soft);color:var(--cn-success)}
.tag.wait{background:var(--cn-reward-soft);color:var(--cn-reward)}
.tag.bad{background:var(--cn-danger-soft);color:var(--cn-danger)}
.tag.new{background:var(--cn-primary-soft);color:var(--cn-primary)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--cn-surface-muted);vertical-align:top}
th{font-weight:600;color:var(--cn-text-muted);font-size:14px}
.empty{margin:2px 0 12px}
.empty b{display:block;font-size:16px;font-weight:600;color:var(--cn-text)}
.empty span{display:block;font-size:13px;color:var(--cn-text-muted);max-width:440px;margin-top:3px}
.note{font-size:13px;color:var(--cn-text-muted);margin-top:8px;line-height:1.55}
.warn{border:1px solid var(--cn-danger);background:var(--cn-danger-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.banner{border:1px solid var(--cn-reward);background:var(--cn-reward-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.miss{color:var(--cn-placeholder)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2a3d;color:#fff;
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s;max-width:min(90vw,620px)}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(31,42,61,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:40}
.modal .box{background:var(--cn-surface);border-radius:12px;max-width:760px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.modal h2{margin:0;padding:12px 16px;font-size:16px;border-bottom:1px solid var(--cn-border)}
.modal .bd{padding:14px 16px;max-height:62vh;overflow:auto}
.modal pre{white-space:pre-wrap;word-break:break-word;font-size:14px;background:var(--cn-surface-subtle);padding:12px;border-radius:8px;border:1px solid var(--cn-border)}
.only-off{display:none}
@media (max-width:760px){
  .side{width:56px;padding:14px 4px 18px}
  .side .brand{font-size:0;padding:0 0 10px}.side .brand small{font-size:0}
  .side .nav{padding:9px 0;text-align:center;font-size:13px}
  .side .grp{text-align:center;font-size:13px;margin:10px 0 4px}
  main{padding:16px 14px 50px}
}
.gate{max-width:420px;margin:60px auto 0;padding:28px 24px;background:var(--cn-surface);border:1px solid var(--cn-border);border-radius:12px}
.gate h1{font-size:20px;font-weight:700;margin:0 0 16px}
.gate .fld{margin:10px 0 4px;font-size:14px;font-weight:600;color:var(--cn-text-muted)}
.gate input.pw{width:100%;padding:9px 11px;border:1px solid var(--cn-border);border-radius:8px;background:var(--cn-surface);font-size:16px}
.gate input.pw:focus{outline:2px solid var(--cn-primary);outline-offset:1px;box-shadow:0 0 0 4px var(--cn-focus)}
.gate .go{margin-top:18px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--cn-primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.gate .go:hover{background:var(--cn-primary-hover)}
.gate .err{margin:8px 0 0;padding:8px 10px;border-radius:8px;font-size:14px;background:var(--cn-danger-soft);color:var(--cn-danger);border:1px solid var(--cn-danger)}
.gate .err.on{display:block}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="app"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>
/* ============================================================
   支点课堂 · 研究管理（原型）
   依据 04《研究支持功能补充设计方案》§二/§三/§十/§十一/§十二 与 05《界面文案与视觉补充要求》。
   只做研究侧四个管理入口；教学侧页面不复制一份假界面，一律跳回本机运行的支点课堂。
   ============================================================ */
const DB_KEY = 'ktpt_v17_rs';
const WB_KEY = 'ktpt_v16_wb';      // 平台开发工作台
const LD_KEY = 'ktpt_v16_ld';      // 教学设计工作台
const ROLE_KEY = 'ktpt_v17_role';  // 本窗口自己的研究身份；学生两端共用的 ktpt_v16_me 不在这里读写，避免成员名变成研究角色
const ADMIN_KEY = 'ktpt_v16_admin'; // 与两个学生窗口共用同一把管理密码
const CHANNEL = 'ktpt17rs';

function fnv (s) { let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16); }
function readDigest (k) {
  try { const o = JSON.parse(localStorage.getItem(k) || 'null'); return o && o.digest ? o : null; }
  catch (e) { return null; }
}
function putDigest (k, v) { const salt = Math.random().toString(36).slice(2, 12);
  localStorage.setItem(k, JSON.stringify({ salt, digest: fnv(v + ':' + salt) })); }
const passState = () => !!readDigest(ADMIN_KEY);
const setPass = p => putDigest(ADMIN_KEY, p);
const checkPass = p => { const o = readDigest(ADMIN_KEY); return !!(o && fnv(p + ':' + o.salt) === o.digest); };

/* 空值不是「没有」这么简单：04 §十一 要求至少区分六类，导出时带原因 */
const MISSING = {
  blank:     '未填写',
  not_happn: '未发生或未实施',
  uncollect: '未采集',
  tech:      '技术失败',
  na:        '不适用',
  denied:    '权限排除'
};
const NODATA = '未填写';
const FRAME = { P: 'P3–P6（平台开发）', M: 'M1–M5（建模）', T: '教师自录指导材料' };
const NODES = {
  n1: '支架开放前已有的作品', n2: '首轮提交或展示版', n3: '反馈后的修订版', n4: '最终提交版'
};
const EVENTS = {
  grant: '获得访问权限', open: '打开支架', expand: '展开某项提示', cite: '学生关联引用'
};
const ROLES = ['教师', '助教', '外部评审者'];
const SOURCE = { reg: '研究者登记', self: '学生填写', system: '系统事件', backfill: '事后补记', import: '外部导入', ai: 'AI 生成', code: '研究者编码', demo: '演示操作' };

/* ---------- 已确认的班级与组队名单（2026-11-22 教师确认） ----------
   两个班各自独立名单，组队是确认过的事实，开机就登记成小组卡；内容领域只是小组字段，不做筛选维度 */
const CLASS_NAMES = ['科教班', '国优班'];
const ROSTER_SINCE = '2026-11-22';
const CLASSES = {
  '科教班': {
    roster: {
      '第1组':['孙千然','朱倢伃','李吉梅'], '第2组':['陈然','詹淑惺','余佳珈'],
      '第3组':['黄彤','杨正馨','刘尚怡'],   '第4组':['黄鈺婷','黄楠','刘倩'],
      '第5组':['张笑笑','迪娜拉·吐鲁松别克','封烨'], '第6组':['祝萱琦','陈媛'],
      '第7组':['于点','叶蓓','茅一萱'],     '第8组':['孙硕','李俊坤','苏天深']
    },
    domains: [['物质科学',['第1组','第2组']], ['生命科学',['第3组','第4组']],
      ['地球与宇宙科学',['第5组','第6组']], ['技术与工程',['第7组','第8组']]]
  },
  '国优班': {
    roster: {
      '第1组':['刘语桐','孙行健','戴斌辉','孙彬哲'], '第2组':['林渝翰','孙婷','倪庆华'],
      '第3组':['王龙飞','陈怡婷','毛文轩'], '第4组':['庞羡钊','邹素芬','侯昀卓','黄家禧'],
      '第5组':['杨子杰','苏子岚','陈洋庆'], '第6组':['应苹苹','刘源琳'],
      '第7组':['张凌韵','杨新月'], '第8组':['周思琪','阮章婧'],
      '第9组':['蒋安琪','单东梅'], '第10组':['刘懿慧','王晨好','马倩倩'],
      '第11组':['徐书楠','马珂敏儿']
    },
    domains: [['数学',['第1组','第2组']], ['物理',['第3组']], ['化学',['第4组','第5组']],
      ['生物',['第6组','第7组']], ['地理',['第8组','第9组']], ['信息技术',['第10组','第11组']]]
  }
};
const classRoster = cn => (CLASSES[cn] || {}).roster || {};
const classDomains = cn => (CLASSES[cn] || {}).domains || [];
const classDomainOf = (cn, gn) => { const d = classDomains(cn).find(x => x[1].indexOf(gn) >= 0); return d ? d[0] : ''; };
const classHeadCount = cn => Object.keys(classRoster(cn)).reduce((n, g) => n + classRoster(cn)[g].length, 0);
const groupOf = (name, cls) => {
  const search = cls ? [cls] : CLASS_NAMES;
  for (const cn of search) { const r = classRoster(cn);
    for (const gn of Object.keys(r)) if (r[gn].indexOf(name) >= 0) return { group: gn, class: cn }; }
  return null;
};
const headCount = () => CLASS_NAMES.reduce((n, cn) => n + classHeadCount(cn), 0);
const rosterNames = () => CLASS_NAMES.reduce((a, cn) => a.concat(Object.keys(classRoster(cn)).reduce((b, g) => b.concat(classRoster(cn)[g]), [])), []);
const namesOf = s => String(s == null ? '' : s).split(/[、,，;；\s]+/).map(x => x.trim()).filter(Boolean);
/* 迁移只认这些旧示例字符串，教师自己写过的内容一律不动 */
const DEMO_CLASS_RE = /示例班级[AB]（(?:高中|小学初中)）?|示例班级[AB]|^国优计划班级$|^国优计划2班$/g;
const DEMO_MEMBERS = ['示例成员A','示例成员B','示例成员C','示例成员D','示例成员E','示例成员F','林小满','陈子昂'];
const DEMO_ANON = { '示例成员A':'P-A-01', '示例成员B':'P-A-02', '示例成员C':'P-A-03' };
/* 更早版本的示例数据用过两个像真名的演示姓名，充当快照记录人与材料添加人。本窗口不改写学生存储，只把它们当成身份线索拦在待复核里 */
const SUSPECT_NAMES = ['林小满','陈子昂'];

/* 每个可填写对象一张卡：字段定义只写一次，界面、导出、验收都读它 */
const CFG = {
  plan: { store: 'plans', pre: 'P', word: '研究安排', add: '新建研究安排', title: f => (f.name || '未命名研究') + ' ' + (f.ver || 'V1'), fields: [
    { k: 'name', l: '研究名称', t: 'text' },
    { k: 'ver', l: '方案版本', t: 'text', ph: 'V1' },
    { k: 'classes', l: '涉及班级', t: 'mset', from: 'classes' },
    { k: 'window_from', l: '观察时段开始', t: 'date' },
    { k: 'window_to', l: '观察时段结束', t: 'date' },
    { k: 'tasks', l: '任务范围', t: 'mset', opts: ['第三周平台开发', '第六周教学设计', '后续修订与展示'] },
    { k: 'compare', l: '主要比较对象', t: 'text', ph: '例：同一任务两轮教学设计之间的差别' },
    { k: 'nodes', l: '计划保存节点', t: 'mset', opts: Object.values(NODES) },
    { k: 'reason', l: '这一版改动理由', t: 'text', ph: '相对上一版改了什么、为什么' }
  ] },
  cond: { store: 'conds', pre: 'C', word: '条件', add: '添加条件', title: f => f.name || '未命名条件', fields: [
    { k: 'name', l: '条件名称', t: 'text' },
    { k: 'unit', l: '分配单位', t: 'sel', opts: ['', '小组', '个人'], req: true },
    { k: 'clazz', l: '所属班级', t: 'sel', from: 'classes' },
    { k: 'who', l: '所属组或个人', t: 'text' },
    { k: 'pair', l: '配对编号', t: 'text' },
    { k: 'topic', l: '主题', t: 'text' },
    { k: 'basis', l: '分配依据', t: 'text', ph: '教师指定／报名／按名单顺序等，写清实际做法' },
    { k: 'at', l: '分配时间', t: 'date' }
  ] },
  person: { store: 'persons', pre: 'R', word: '参与者', add: '添加参与者', title: f => f.anon || '未编号', fields: [
    { k: 'anon', l: '匿名编号', t: 'text', ph: 'P-A-01' },
    { k: 'clazz', l: '班级', t: 'sel', from: 'classes' },
    { k: 'subject', l: '学科背景', t: 'text', miss: true },
    { k: 'design', l: '既往教学设计经历', t: 'text', miss: true },
    { k: 'coding', l: '编程与 Qoder 使用经历', t: 'text', miss: true }
  ] },
  group: { store: 'groups', pre: 'G', word: '小组', add: '添加小组', title: f => f.no || '未编号', fields: [
    { k: 'no', l: '班级与组号', t: 'text', ph: CLASS_NAMES[0] + ' 第1组' },
    { k: 'who', l: '成员', t: 'text', local: true, ph: '顿号分隔，与班级名单一致' },
    { k: 'domain', l: '内容领域', t: 'sel', opts: [''].concat(CLASS_NAMES.reduce((a, cn) => a.concat(classDomains(cn).map(d => d[0])), [])) },
    { k: 'since', l: '当前名单生效时间', t: 'date', req: true },
    { k: 'size_ok', l: '人数是否在 2–3 人', t: 'sel', opts: ['', '是', '否，见说明'] }
  ] },
  memberlog: { store: 'memberlogs', pre: 'L', word: '成员调整', add: '登记成员调整', title: f => (f.no || '未选组') + ' ' + (f.act || '') + ' ' + (f.who || ''), fields: [
    { k: 'no', l: '哪个小组', t: 'sel', from: 'groups' },
    { k: 'act', l: '调整', t: 'sel', opts: ['', '加入', '退出', '改名'] },

function migrateRoster () {
  if (db.rosterSeeded) return false;

  const swap = t => String(t == null ? '' : t).replace(DEMO_CLASS_RE, CLASS_NAMES[0]);
  /* 示例数据里编造的「某成员退出」是对本班同学的假陈述，整条撤下并暂存，可撤销 */
  const drop = cardsOf('memberlog').filter(id => namesOf(field(id, 'who')).some(m => DEMO_MEMBERS.indexOf(m) >= 0));
  if (drop.length) {
    db.stash = db.stash || {};
    drop.forEach(id => { const atoms = {}; Object.keys(db.atoms).forEach(k => { if (k.indexOf(id + '.') === 0) atoms[k] = db.atoms[k]; });
      db.stash[id] = { at: now(), index: db.cards.memberlogs.indexOf(id), name: 'memberlog', atoms, grants: [], by: '系统迁移' }; });
    db.cards.memberlogs = db.cards.memberlogs.filter(id => drop.indexOf(id) < 0);
    hit = true;
  }
  Object.keys(db.atoms).forEach(k => { const a = db.atoms[k]; if (!a || !a.text) return;
    const t = swap(a.text); if (t !== a.text) { a.text = t; hit = stale = true; } });
  db.grants.forEach(g => { const t = swap(g.to); if (t !== g.to) { g.to = t; hit = stale = true; } });
  if (db.classes.some(c => /示例班级/.test(c.name || ''))) {
    db.classes = uniq(db.classes.map(c => swap(c.name))).map(name => ({ name })); hit = stale = true;
  }
  CLASS_NAMES.forEach(cn => { if (!db.classes.some(c => c.name === cn)) { db.classes.push({ name: cn }); hit = true; } });
  CLASS_NAMES.forEach(cn => {
    const roster = classRoster(cn);
    Object.keys(roster).forEach(gn => {
      const no = cn + ' ' + gn;
      let id = cardsOf('group').find(x => field(x, 'no') === no);
      const fresh = !id;
      if (fresh) { id = nextId('group'); db.cards.groups.push(id); db.createdBy[id] = { by: '教师确认名单', at: now() }; }
      if (fresh && seedAtom(id, 'no', no, '教师确认名单')) hit = true;
      const cur = namesOf(field(id, 'who'));
      const wasDemo = fresh || !cur.length || cur.every(m => DEMO_MEMBERS.indexOf(m) >= 0);
      const set = (k, v, force) => { if (v && (force || !field(id, k)) && seedAtom(id, k, v, '教师确认名单')) hit = true; };
      const n = roster[gn].length;
      set('who', roster[gn].join('、'), wasDemo);
      set('since', ROSTER_SINCE, wasDemo);
      set('domain', classDomainOf(cn, gn), wasDemo);
      set('size_ok', n >= 2 && n <= 3 ? '是' : '', wasDemo);
    });
  });
  /* 使用记录的「谁」写的是匿名编号：早期示例成员当过的演员换成对应编号 */
  db.events.forEach(e => { const t = DEMO_ANON[swap(e.who)] || swap(e.who);
    if (t !== e.who) { e.who = t; hit = stale = true; } });
  db.rosterSeeded = ROSTER_SINCE;
  if (hit) log('按 ' + ROSTER_SINCE + ' 确认名单登记班级与组队' + (stale ? '，并改写本机遗留的旧班级名' : ''));
  return hit;
}

function scopeText () {
  const f = db.filters;
  return ['方案 ' + (f.plan || '不限'), '班级 ' + (f.classes.length ? short(f.classes.join('、'), 22) : '不限'),
    '任务 ' + (f.tasks.length ? short(f.tasks.join('、'), 22) : '不限'), '轮次 ' + (f.round || '不限'),
    '快照 ' + (f.snap || '不限'), '时间 ' + (f.from || '…') + '→' + (f.to || '…')].join('｜');
}
/* 学生端只在界面上算「当场／补记」，这里读原始存储，按同样的规则重算一次 */
function decTimingOf (d) {
  if (!d.event_at) return 'uncollect：学生没有填事件时间，只有本机记录时间';
  const ev = new Date(d.event_at).getTime();
  if (isNaN(ev)) return '事件时间无法解析：' + d.event_at;
  const gap = ((d.at || 0) - ev) / 86400000;
  if (gap < 0) return '事件时间晚于记录时间，请核对';
  return gap <= 1 ? '当场记录' : '补记（距事件约 ' + Math.round(gap) + ' 天）';
}

    note: '实施条件与过程记录（额外接触、技术中断等）', status_note: sc.extra.all + sc.mres.all ? '' : '未采集：没有额外接触与作答记录' });
  add({ f: 'ai_summary_records.json', status: 'notenabled',
    note: 'AI 整理的输入引用、整理要求、模型信息、输出版本与核对记录',
    status_note: '未启用：没有 AI 整理对象的登记入口，不生成假记录（需要输入引用、模型信息、输出版本、核对记录四类字段）' });
  add({ f: 'materials_index.csv', status: matSc.all ? 'ok' : 'notcollected', shape: 'rows', expect: matSc.kept.length,
    text: matSc.all ? csv(['材料编号', '类型', '名称或链接', '位置说明', '文本是否已提取', '来源窗口', '添加人', '添加时间', '随包情况'],
      matSc.kept.map(r => { const m = r.raw; return [m.id, m.kind, m.url || m.name, m.loc || '', m.extracted ? 'yes' : 'no',
        m.from, m.by, m.at ? fmtTime(m.at) : '', m.extracted ? 'materials/（本原型不落文件本体）' : 'not_included：只登记了位置与读取限制']; })) : '',
    note: '材料索引：外部资料只记位置与读取限制', status_note: matSc.all ? '' : '未采集：两个学生窗口还没有登记材料' });
  add({ f: 'materials/', status: 'notcollected', note: '随包文本与附件',
    status_note: '未采集：没有文件目录可写；文本材料要在真实平台按 materials_index.csv 的编号落盘' });

  const counted = files.filter(e => e.f !== 'manifest.json').map(e => Object.assign(e, { records: realCount(e) }));
  const mismatch = counted.filter(e => e.expect != null && e.records !== e.expect).map(e => e.f);
  const allRows = CARDS.reduce((a, n) => a.concat(sc[n].rows), [])
    .concat(snapSc.rows, decSc.rows, ansSc.rows, editSc.rows, matSc.rows, grantSc.rows, evSc.rows);
  const revUsed = allRows.filter(r => r.reviewed);
  const revPending = allRows.filter(r => r.s === 'review' && r.leaks && r.leaks.length);
  files[0].text = readmeOf(files, revUsed, revPending);   // README 要列缺口与复核标记，得先算好其他文件的状态
  files[1].text = jsonObjs({ schema: PKG_SCHEMA, exported_at: new Date(now()).toISOString(),
    exported_at_local: fmtTime(now()), exported_by_role: ME, identity_note: '身份切换不是登录，本机没有权限判断',
    source_windows: { workbench: ref.hasWb, lesson_design: ref.hasLd, read: ref.from, group: ref.name },
    scope: db.filters, scope_rule: '命中纳入／提到别的值排除／缺该维度进待复核',
    files: counted.map(e => ({ file: e.f, status: e.status, records_in_file: e.records, records_expected_by_ui: e.expect,
      reconciles: e.expect == null ? 'not_applicable' : (e.records === e.expect ? 'yes' : 'no'), note: e.note, status_note: e.status_note })),
    manual_review: { rule: '复核标记只决定这条记录进不进这一批，不改写原文；维度判不出来的条目复核后仍留在待复核',
      marked: revUsed.map(r => ({ record_key: r.key, judgement: r.s, reviewed_by: r.reviewed.by,
        reviewed_at: fmtTime(r.reviewed.at), leaks: r.leaks })),
      still_waiting_for_review: revPending.length },
    excluded_from_package: ['身份对应表', '账号凭据', '未授权的原始材料与附件本体'],
    reconciliation_note: 'records_in_file 由已生成正文重算，records_expected_by_ui 来自筛选计数，两条路径分开，不一致时页面标红' });

  const groups = CARDS.map(n => [CFG[n].word, sc[n]]).concat([
    ['作品快照', snapSc], ['关键决策', decSc], ['学生个人作答', ansSc], ['编辑与讨论', editSc], ['材料', matSc], ['支架开放', grantSc], ['使用事件', evSc]]);
  const detail = [];
  groups.forEach(([label, x]) => x.rows.forEach(r => detail.push({ grp: label, key: r.key, s: r.s, why: r.why, leaks: r.leaks,
    reviewed: r.reviewed, title: r.id ? titleOf(r.name, r.id) : '' })));
  return { files, groups, detail, sc, snapSc, decSc, ansSc, editSc, matSc, grantSc, evSc,
    revMarked: revUsed.length, revWaiting: revPending.length,
    counts: counted.reduce((n, e) => n + (e.records || 0), 0), mismatch,
    kept: groups.reduce((n, [, x]) => n + x.kept.length, 0), out: groups.reduce((n, [, x]) => n + x.out.length, 0),
    review: groups.reduce((n, [, x]) => n + x.review.length, 0), all: groups.reduce((n, [, x]) => n + x.all, 0) };
}
/* 记录数从生成的文本里重算，避免清单与文件各说一套 */
function realCount (e) {
  const t = e.text || ''; if (!t) return 0;
  if (e.shape === 'rows' || e.shape === 'long') {
    const body = t.replace(/^\ufeff/, '').split('\n').filter(x => x.length).slice(1);
    if (e.shape === 'long') return uniq(body.map(x => x.split(',')[0])).length;   // 长表一行是一个字段，按对象编号去重
    return body.length;
  }
  try { const o = JSON.parse(t);
    if (Array.isArray(o)) return o.length;
    return Object.keys(o).reduce((n, k) => n + (Array.isArray(o[k]) ? o[k].length : 0), 0);
  } catch (err) { return 0; }
}

function grantDemo (id, to) {
  const g = { id: 'V' + (++db.seq.V), at: now(), scaf: id, ver: field(id, 'ver') || 'V1', to: to || field(id, 'to') || NODATA,
    by: ME, body: field(id, 'body'), src: 'system' };
  db.grants.push(g);
  db.events.push({ id: 'E' + (++db.seq.E), at: g.at, kind: 'grant', who: g.to, scaf: id, ver: g.ver, task: field(id, 'task'), src: g.src });
  log('实际开放 ' + id + ' ' + g.ver + ' 给 ' + g.to); save(); render();
}

/* ---------- 渲染 ---------- */
function view () {
  return { plan: planView, cond: condView, scaf: scafView, use: useView, who: whoView,

function helpView () {

    '导出先按范围筛，再逐条预览纳入／排除／待复核，过匿名化检查后出研究包，原文不改写。</p>' +

function exportModal (fmt) {

    '按范围筛选、匿名化检查与研究包结构在「研究导出」页面里生成。</div>' +

}
function toast (t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2600); }

/* ---------- 事件 ---------- */
let fmt = 'md';
document.addEventListener('click', e => {
  const el = e.target.closest('[data-page],[data-act],[data-add],[data-del],[data-copy],[data-open],[data-newver],[data-undo],[data-set],summary,button,a');
  if (!el) return;
  if (el.tagName === 'A' && el.href) return;              // 外部链接照常打开
  if (el.tagName === 'SUMMARY') { const id = el.parentElement.dataset.card; if (id) { ui.open[id] = !el.parentElement.open; } return; }
  const d = el.dataset;
  if (d.page) { ui.page = d.page; render(); window.scrollTo(0, 0); return; }
  if (d.add) { const id = addCard(d.add); ui.open[id] = true; render(); toast('已添加 ' + id); return; }
  if (d.del) { delCard(d.del); return; }
  if (d.undo) { undoDel(d.undo); return; }
  if (d.copy) { supersede(d.copy); return; }
  if (d.open) { grantDemo(d.open); toast('已记实际开放时间与当时版本'); return; }
  if (d.newver) { const nid = supersede(d.newver); if (nid) grantDemo(nid); return; }
  if (d.set) { const box = el; setOf(d.set.split('.').slice(0, -1).join('.'), d.set.split('.').pop(), d.opt, box.checked); render(); return; }
  if (d.openAll) { const ids = cardsOf(d.openAll); const all = ids.every(i => ui.open[i]); ids.forEach(i => ui.open[i] = !all); render(); return; }
  switch (d.act) {
    case 'side': ui.side = !ui.side; render(); break;
    case 'help': ui.modal = 'help'; paintModal(); break;
    case 'export': ui.page = 'export'; render(); window.scrollTo(0, 0); break;
    case 'notes': ui.modal = 'export'; paintModal(); break;
    case 'flt-reset': db.filters = blankDb().filters; ui.expShow = 'need'; save(); render(); toast('筛选已清除，本机记录没有改动'); break;
    case 'exp-show': ui.expShow = ui.expShow === 'all' ? 'need' : 'all'; render(); break;
    case 'rev-ok': { const k = d.rk; if (!k) break;
      db.reviewed[k] = { by: ME, at: now() }; log('人工复核通过：' + k);
      const row = (pkgCache = pkgBuild()).detail.filter(x => x.key === k)[0] || {};
      save(); render();
      toast(row.s === 'in' ? '已标记复核：' + k + ' 进这一批，原文没有改动'
        : '已标记复核，但这条仍判为' + (row.s === 'out' ? '排除（范围不符）' : '待复核：' + (row.why[0] || '原因见上'))); break; }
    case 'rev-undo': { const k = d.rk; if (!k) break;
      delete db.reviewed[k]; log('撤销人工复核：' + k); pkgCache = pkgBuild(); save(); render();
      toast('已撤销复核标记：' + k + ' 回到待复核'); break; }
    case 'pkg-preview': pkgCache = pkgCache || pkgBuild(); ui.pkgN = +d.n; ui.modal = 'pkg'; paintModal(); break;
    case 'pkg-copy': { const e2 = (pkgCache || pkgBuild()).files[+d.n] || {}, t = e2.text || '';
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
        .then(() => toast('已复制 ' + e2.f + '，' + t.length + ' 字')).catch(() => toast('浏览器未授权剪贴板，请在预览框里全选复制')); break; }
    case 'pkg-dl': { const e2 = (pkgCache || pkgBuild()).files[+d.n] || {}, a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([e2.text || ''], { type: 'text/plain;charset=utf-8' }));
      a.download = e2.f || 'research-package.txt'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      log('下载研究包文件 ' + e2.f); save(); toast('已下载 ' + e2.f); break; }
    case 'pkg-log': { const pk = pkgCache || pkgBuild();
      const code = 'EXP-' + fmtDay(now()).replace(/-/g, '') + '-' + String((db.expSeq || 0) + 1).padStart(2, '0');
      db.expSeq = (db.expSeq || 0) + 1;
      db.exports.unshift({ code, at: now(), by: ME, schema: PKG_SCHEMA, scope: scopeText(), files: pk.files.length,
        records: pk.counts, review: pk.review, out: pk.out, reviewed: pk.revMarked, mismatch: pk.mismatch.join('、') });
      db.exports = db.exports.slice(0, 60);
      log('记录导出批次 ' + code + '：' + pk.files.length + ' 个文件、' + pk.counts + ' 条记录、待复核 ' + pk.review +
        '、复核纳入 ' + pk.revMarked);
      save(); render(); toast('已记批次 ' + code + '，只存清单与计数，不存正文'); break; }
    case 'export-toggle': fmt = fmt === 'md' ? 'json' : 'md'; paintModal(); break;
    case 'close-modal': ui.modal = null; paintModal(); break;
    case 'copy-export': { const text = exportText(fmt);
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
        .then(() => toast('已复制 ' + text.length + ' 字')).catch(() => toast('浏览器未授权剪贴板，请在预览框里全选复制')); break; }
    case 'dl-export': { const text = exportText(fmt), a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
      a.download = '研究管理记录-' + fmtDay(now()) + (fmt === 'json' ? '.json' : '.md'); a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('已下载'); break; }
    case 'set-pass': { const p1 = document.getElementById('p1'), p2 = document.getElementById('p2');
      const v1 = p1 ? p1.value : '', v2 = p2 ? p2.value : '';
      if (v1.length < 4) { ui.gateErr = '管理密码至少 4 位'; render(); return; }
      if (v1 !== v2) { ui.gateErr = '两次输入不一致'; render(); return; }
      setPass(v1); ui.gateErr = ''; gatePass = true; render(); toast('管理密码已设置'); break; }
    case 'check-pass': { const p1 = document.getElementById('p1');
      const v = p1 ? p1.value : '';
      if (!checkPass(v)) { ui.gateErr = '密码错误'; render(); return; }
      ui.gateErr = ''; gatePass = true; render(); break; }
    case 'demo-clear': if (confirm('清空本机研究管理记录？平台开发与教学设计两个窗口的内容不受影响。')) {
        localStorage.removeItem(DB_KEY); db = blankDb(); ui = { page: 'plan', open: {}, modal: null, side: ui.side };
        migrateRoster(); save(true);
        render(); toast('已清空，回到空状态；确认名单里的班级与 8 组组队重新登记'); } break;
    case 'add-class': { const el = document.getElementById('newclass'), name = el && el.value.trim();
        if (!name) { toast('先在输入框里写班级名称'); break; }
        if (classesList().includes(name)) { toast(name + ' 已经登记过'); break; }
        db.classes.push({ name }); log('登记班级 ' + name); save(); render(); break; }
  }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-k]'); if (!el) return;
  put(el.dataset.k, el.value);
});
document.addEventListener('change', e => {
  const box = e.target.closest('#condon');
  if (box) { db.condOn = box.checked; log(box.checked ? '启用比较条件' : '暂不启用比较条件'); save(); render(); return; }
  const who = e.target.closest('#me');
  if (who) { ME = who.value; localStorage.setItem(ROLE_KEY, ME); log('身份切到 ' + ME); save(); render(); return; }
  const flt = e.target.closest('[data-f]');
  if (flt) { db.filters[flt.dataset.f] = flt.value; save(); render(); return; }
  const fs = e.target.closest('[data-fset]');
  if (fs) { const k = fs.dataset.fset, cur = db.filters[k] || [], o = fs.dataset.opt, i = cur.indexOf(o);
    if (fs.checked && i < 0) cur.push(o); if (!fs.checked && i >= 0) cur.splice(i, 1);
    db.filters[k] = cur; save(); render(); return; }
  const el = e.target.closest('[data-k]'); if (!el) return;
  if (el.tagName === 'SELECT') put(el.dataset.k, el.value);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const el = e.target.closest('.gate input.pw'); if (!el) return;
  const btn = document.querySelector('.gate .go'); if (btn) btn.click();
});

/* 验收自测用的只读访问器，不参与界面渲染 */
window.__dbg = () => { ref = readRef(); const pk = pkgBuild();
  return { me: ME, tab: TAB, page: ui.page, rev: db._rev, cards: Object.fromEntries(CARDS.map(n => [n, cardsOf(n).length])),
    pkg: { files: pk.files.length, records: pk.counts, kept: pk.kept, out: pk.out, review: pk.review,
      revMarked: pk.revMarked, revWaiting: pk.revWaiting, reviewed: JSON.parse(JSON.stringify(db.reviewed || {})),
      mismatch: pk.mismatch, status: pk.files.map(e => e.f + '=' + e.status + '/' + e.records) },
    filters: JSON.parse(JSON.stringify(db.filters)), batches: db.exports.length,
    seq: Object.assign({}, db.seq), condOn: !!db.condOn, classes: classesList(),
    grants: db.grants.length, events: Object.keys(EVENTS).reduce((o, k) => (o[k] = db.events.filter(e => e.kind === k).length, o), {}),
    demoEvents: db.events.filter(e => e.demo).length, revisions: db.revisions.length, stash: Object.keys(db.stash || {}).length,
    missing: missingCount(), refWb: ref.hasWb, refLd: ref.hasLd, refName: ref.name,
    decisions: ref.decisions.length, answers: ref.answers.length, legacyRef: ref.legacy, windows: ref.windows,
    presence: freshPresence().map(p => p.by + '→' + p.page) }; };

setInterval(() => { announce(); paintPresence(); }, 5000);
window.addEventListener('focus', () => { const keep = ui; load(); Object.assign(ui, keep); render(); });
if (!load()) { migrateRoster(); save(true); }   /* 首次打开也按确认名单登记班级与 8 组组队 */
render(); announce();
