<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第六周小组教学设计工作台</title>
<style>
:root{
  --fg:#26333f; --mut:#657382; --line:#d8e1e8; --bg:#f4f6f8; --card:#fff;
  --pri:#466b8a; --pri-bg:#edf2f6; --ok:#52745f; --warn:#966b34; --bad:#a95f58;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer}
a{color:var(--pri)}

/* ---------- 顶栏 ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px}
.bar-in{max-width:980px;margin:0 auto}
.row1{display:flex;gap:10px 18px;align-items:flex-start;flex-wrap:wrap}
.grp-name{font-size:17px;font-weight:600}
.grp-facts{display:flex;gap:2px 14px;flex-wrap:wrap;font-size:14px;color:var(--mut);flex:1;min-width:200px}
.grp-facts b{color:var(--fg);font-weight:500}
.row2{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.spacer{flex:1}
.save-state{font-size:14px;color:var(--mut)}
.save-state.ok{color:var(--ok)} .save-state.bad{color:var(--bad)}
.who{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
.btn{font-size:15px;padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--fg);text-decoration:none;display:inline-block}
.btn:hover{border-color:#b9c9d6;background:#f8fafb}
.btn.pri{border-color:var(--pri);background:var(--pri);color:#fff}
.btn.pri:hover{background:#3b5b76}
.btn.ghost{border-color:transparent;color:var(--pri);background:none;padding:6px 8px}
.btn.sm{font-size:14px;padding:4px 9px}
.btn:disabled{color:#8b97a3;border-color:var(--line);background:#edf2f6;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.seg button:focus-visible,summary:focus-visible,
input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.tasks{display:inline-flex;gap:4px;align-items:center;font-size:14px}
.tasks .now{font-size:14px;padding:5px 11px;border-radius:999px;background:var(--pri-bg);border:1px solid var(--pri);color:var(--pri);font-weight:600}
.tasks a{font-size:14px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mut);background:#fff;text-decoration:none}
.tasks a:hover{color:var(--pri);border-color:var(--pri)}

/* ---------- 空状态 ---------- */
.es{margin:2px 0 12px}
.es b{display:block;font-size:16px;font-weight:600;color:var(--fg)}
.es span{display:block;font-size:13px;color:var(--mut);max-width:440px;margin-top:3px}

/* ---------- 入口：两扇门 ---------- */
.gate{max-width:420px;margin:0 auto;padding:54px 20px 60px}
.gate h1{font-size:19px;font-weight:600;margin:0 0 6px}
.gate .lead,.lead{font-size:13px;color:var(--mut);margin:0 0 18px}
.gate .fld,.fld{font-size:14px;font-weight:600;color:var(--mut);margin:0 0 7px}
.doors{display:grid;gap:12px}
.door{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 17px;color:var(--fg)}
.door:hover{border-color:var(--pri)}
.door b{display:block;font-size:16px;font-weight:600}
.door span{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.gate input.pw{display:block;width:100%;padding:11px 13px;font-size:16px;margin:0 0 14px;
  border:2px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--fg)}
.gate input.pw:focus{outline:none;border-color:var(--pri)}
.codes{display:flex;gap:10px;justify-content:center;margin:0 0 16px}
.codes input.code{width:64px;height:72px;text-align:center;font-size:2rem;font-weight:600;padding:0;
  border:2px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--fg)}
.codes input.code:focus{outline:none;border-color:var(--pri)}
.go{display:block;width:100%;font-size:15px;padding:11px 14px;border:1px solid var(--pri);
  background:var(--pri);color:#fff;border-radius:8px}
.go:hover{background:#3b5b76}
.err{display:none;margin:0 0 14px;padding:8px 11px;font-size:13px;color:#b91c1c;
  background:#f8eeee;border:1px solid #fca5a5;border-radius:8px}
.err.on{display:block}
.pick{display:grid;gap:10px;margin-top:4px}
.pgrp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.pgrp b{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:7px}
.pms{display:flex;gap:8px;flex-wrap:wrap}
.pms button{font-size:15px;padding:7px 13px;border:1px solid var(--line);background:#fff;
  border-radius:999px;color:var(--fg)}
.pms button:hover{border-color:var(--pri);color:var(--pri)}
.pgrp.mine{border-color:var(--pri)}
.pgrp.out b,.pgrp.out .pms button{color:var(--mut)}
.pgrp.out .pms button{background:#f7f9fa;cursor:default}
.pgrp.out .pms button:hover{border-color:var(--line);color:var(--mut)}

/* ---------- 容器 ---------- */
.wrap{max-width:980px;margin:0 auto;padding:14px 20px 100px}

/* ---------- 基本信息条 ---------- */
.proj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.proj-hd{display:flex;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;font-size:15px;list-style:none}
.proj-hd::-webkit-details-marker{display:none}
.proj-hd::before{content:"⌄";color:var(--mut);font-size:12px}
.proj:not([open]) .proj-hd::before{content:"›"}
.proj-hd .sum{color:var(--mut);font-size:14px;flex:1}
.proj-bd{padding:10px 16px 14px;border-top:1px solid var(--line);display:grid;gap:12px 18px;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.shared{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.shared h4{font-size:14px;margin:0 0 6px;font-weight:600}
.shared .kv2{display:grid;gap:2px 10px;grid-template-columns:auto 1fr}
.shared .kv2 span{color:var(--mut);font-size:14px}
.shared .kv2 b{font-weight:500;font-size:14px}
.think{margin:4px 0 10px;font-size:14px}
.think summary{cursor:pointer;color:var(--pri);font-weight:500;list-style:none;display:inline-flex;align-items:center;gap:4px}
.think summary::-webkit-details-marker{display:none}
.think summary::before{content:"▸";font-size:11px;transition:transform .15s}
.think[open] summary::before{transform:rotate(90deg)}
.think p{margin:6px 0 0;padding-left:16px}

/* ---------- 四个入口 ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:0;list-style:none}
.tab{font-size:15px;padding:7px 14px;border:1px solid var(--line);background:var(--card);border-radius:999px;color:var(--mut)}
.tab[aria-selected=true]{border-color:var(--pri);background:var(--pri-bg);color:var(--pri);font-weight:600}
.tab i{font-style:normal;font-size:13.5px;opacity:.85;margin-left:6px}

/* ---------- 轮次切换 ---------- */
.round-tabs{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.rtab{font-size:14px;padding:5px 16px;border:1px solid var(--line);background:var(--card);border-radius:8px 8px 0 0;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
.rtab.on{border-color:var(--pri);background:var(--pri-bg);color:var(--pri);font-weight:600;border-bottom-color:var(--pri-bg)}

/* ---------- 题目卡片 ---------- */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.q>h2{font-size:17px;margin:0 0 12px;font-weight:600;line-height:1.45}
.q>h3{font-size:15px;margin:14px 0 6px;font-weight:600}
.f{margin:0 0 12px}
.f:last-of-type{margin-bottom:0}
.f>label,.f>.lab{display:block;font-size:14px;font-weight:600;margin-bottom:4px;color:var(--mut)}
.f .opt{font-size:13.5px;color:var(--mut);font-weight:normal;margin-left:5px}
input[type=text],textarea,select{font:inherit;font-size:16px;width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--fg)}
textarea{resize:vertical;min-height:60px;line-height:1.6;overflow:hidden}
input::placeholder,textarea::placeholder{color:#8b97a3}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(70,107,138,.18);outline:none}
input:disabled,textarea:disabled,select:disabled{background:#edf2f6;color:#8b97a3;box-shadow:none;border-color:var(--line)}
select.empty{color:#8b97a3}
.two{display:grid;gap:12px 18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

/* ---------- 选填条目折叠 ---------- */
details.dis{margin-top:10px}
details.dis>summary{cursor:pointer;font-size:14px;color:var(--pri);list-style:none}
details.dis>summary::-webkit-details-marker{display:none}
details.dis>summary::before{content:"› ";font-weight:700}
details.dis[open]>summary::before{content:"⌄ "}
.ex b{color:var(--fg)}

/* ---------- 卡片（目标 / 活动 / 评价 / 反馈） ---------- */
.rec{border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;background:#fbfcfd;overflow:hidden}
.rec>summary{padding:11px 14px;display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap;font-size:15px;list-style:none;cursor:pointer}
.rec>summary::-webkit-details-marker{display:none}
.rec>summary::before{content:"⌄";color:var(--mut);font-size:12px}
.rec:not([open])>summary::before{content:"›"}
.rec>summary b{font-weight:600}
.rec>summary .untitled{color:#8b97a3;font-weight:400}
.rec>summary .end{flex:1}
.rec>.bd{padding:4px 14px 14px;border-top:1px solid var(--line)}
.rec>.bd>.ops{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed #e2e8ee}
.tag{font-size:13px;background:#edf2f6;color:#41596f;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.s0{background:#e9edf1;color:#657382}
.tag.s1{background:#fbf3e6;color:#966b34}
.tag.s2{background:#dce7ef;color:#466b8a}
.tag.s3{background:#edf4ef;color:#52745f}
.tag.ok{background:#edf4ef;color:#52745f}
.tag.bad{background:#f9eeee;color:#a95f58}
.tag.m{background:#f3e8fd;color:#6b3fa0}
.tag.none{background:#fff;color:#8b97a3;border:1px dashed var(--line)}

/* ---------- 建模实践多选 ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--mut)}
.chip[aria-pressed=true]{border-color:#6b3fa0;background:#f3e8fd;color:#6b3fa0;font-weight:600}
.chip .h{font-size:13px;opacity:.85;margin-left:5px}
.checks{display:grid;gap:2px 14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));font-size:15px}
.checks label{display:flex;gap:6px;align-items:baseline}
.checks input{width:auto;margin:0}

/* ---------- 题目底部四个按需入口 ---------- */
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tool{font-size:15px;padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--mut)}
.tool:hover{color:var(--pri);border-color:var(--pri)}
.tool[aria-expanded=true]{background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
.tool .n{font-size:12px;margin-left:4px;opacity:.8}
.panel{margin-top:10px;background:#f8fafb;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.panel h3{font-size:15px;margin:0 0 8px;font-weight:600}
.cmt{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:0 0 10px;font-size:14px}
.cmt .hd{font-size:13px;color:var(--mut)}
.cmt .hd b{color:var(--fg);font-weight:500}
.cmt .hd .tch{color:var(--pri)}
.cmt .rp{margin-left:12px;margin-top:6px}
.mat{display:flex;gap:8px;align-items:baseline;font-size:14px;padding:4px 0;border-bottom:1px dashed #e2e8ee}
.mat:last-child{border-bottom:0}
.mat .end{flex:1}
.hist{font-size:14px;padding:5px 0;border-bottom:1px dashed #e2e8ee}
.hist:last-child{border-bottom:0}
.hist .hd{color:var(--mut);font-size:13px}
.hist .dv{display:grid;gap:4px 10px;grid-template-columns:1fr 1fr;margin-top:4px}
.hist .dv div{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:pre-wrap;word-break:break-word}
.hist .dv .was{color:#8b97a3}
.hist .dv .now{color:var(--fg)}

/* ---------- 关键决定记录（04 §五） ---------- */
.dec{border:1px solid var(--line);border-left:3px solid var(--pri);background:#fff;border-radius:8px;padding:10px 12px;margin:0 0 12px}
.dec .hd{font-size:16px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.dec .hd b{color:var(--fg);font-weight:600}
.dec .hd .end{flex:1}
.dec .lab{font-size:16px;color:var(--mut);margin:8px 0 2px}
.dec .val{font-size:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.chk{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:16px}
.chk label{display:flex;gap:6px;align-items:center;font-size:16px}

/* ---------- 个人任务（04 §六） ---------- */
.ptask{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px;background:#fff}
.ptask .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px;font-weight:600;margin-bottom:2px}
.ptask .facts{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:16px;color:var(--mut);margin:6px 0 10px}
.ptask .facts b{color:var(--fg);font-weight:500}

/* ---------- 同框协作 ---------- */
.presence{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--mut);margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.pchip{background:var(--pri-bg);color:var(--pri);border-radius:999px;padding:1px 8px;font-size:13px}
.conflict{margin-top:8px;background:#f9eeee;border:1px solid #e3c4c0;border-radius:8px;padding:9px 11px;font-size:14px;color:#a95f58}
.conflict .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
.online{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut);flex-wrap:wrap}

/* ---------- 弹窗与教案预览 ---------- */
#mask{position:fixed;inset:0;background:rgba(20,26,34,.34);display:flex;align-items:center;justify-content:center;
  z-index:60;padding:20px}
.dlg{background:#fff;border-radius:12px;max-width:860px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.dlg>h2{font-size:17px;margin:0;padding:14px 18px 0}
.dlg .bd{padding:12px 18px;overflow:auto}
.dlg .ft{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.dlg .ft .end{flex:1}
.dlg pre{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:#f8fafb;
  border:1px solid var(--line);border-radius:8px;padding:12px;max-height:46vh;overflow:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:14px;color:var(--mut);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--pri-bg);color:var(--pri);font-weight:600}
.kv{font-size:15px}
.kv div{padding:3px 0}
.kv b{font-weight:600;color:var(--fg)}
.pv{font-size:15px}
.pv h3{font-size:16px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.pv h4{font-size:16px;margin:12px 0 4px}
.pv ul,.pv ol{margin:4px 0 8px;padding-left:22px}
.pv p{margin:4px 0}
.pv .none2{color:#8b97a3}
.pv .meta{font-size:14px;color:var(--mut)}

/* ---------- 只读 ---------- */
.ro-badge{display:inline-block;font-size:13px;background:#edf2f6;color:#41596f;border-radius:999px;padding:2px 10px}
.ro textarea,.ro input,.ro select,.ro .chip{pointer-events:none}
.glist{display:grid;gap:10px}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;display:flex;
  gap:8px 16px;align-items:center;flex-wrap:wrap;font-size:16px}
.gitem .end{flex:1}
.gitem .sm{font-size:14px;color:var(--mut)}
h1.pg{font-size:22px;margin:4px 0 14px;font-weight:600}
.end{flex:1}
.hint{font-size:13px;color:var(--mut);line-height:1.55}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;background:#26333f;color:#fff;
  font-size:14px;padding:9px 16px;border-radius:8px;max-width:90vw}

/* ---------- 窄屏 ---------- */
@media (max-width:720px){
  body{font-size:16px}
  .bar{padding:10px 14px}
  .wrap{padding:12px 14px 90px}
  .q{padding:16px 14px}
  .q>h2{font-size:18px}
  .proj-bd{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .checks{grid-template-columns:1fr}
  .row1,.row2{gap:8px 10px}
  .tab{padding:8px 12px}
  .btn{padding:7px 11px}
  .codes input.code{width:56px;height:64px;font-size:1.7rem}
  .hist .dv{grid-template-columns:1fr}
  .dlg{max-height:92vh}
}
</style>
<script type="module" src="../firebase-integration.js"></script>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" hidden></div>

<script>
/* ============================================================
   第六周小组教学设计工作台
   依据 outputs/课程材料v16_第三周工作台/02_教学设计页面交接指南.md
   与第三周平台开发工作台是两个独立窗口：各自一份数据，互不覆盖。
   小组信息、平台功能与材料从第三周工作台的本机内容只读共享，读不到时可手填。
   ============================================================ */

/* ---------- 建模实践：学生界面短标题 + 按需展开的问题 ---------- */
const M_PRACTICE = [
  { v:'M1', short:'明确要解决的问题',   full:'M1 明确建模的现象或问题',
    tip:'要让学生用模型解释、预测或解决什么？' },
  { v:'M2', short:'找出关键要素', full:'M2 确定考虑什么、暂时不考虑什么',
    tip:'哪些因素必须考虑？哪些可先忽略？为什么？' },
  { v:'M3', short:'表达关系和规则', full:'M3 设计并构建模型的结构',
    tip:'要用图、表、规则、方程或程序表示哪些关系？' },
  { v:'M4', short:'对照证据并修改', full:'M4 测试、评价与调试模型的表现',
    tip:'模型结果与数据或现象一致吗？不一致时怎样查找原因并修改？' },
  { v:'M5', short:'用模型解释或预测',   full:'M5 运用模型解释、预测或设计方案',
    tip:'模型能说明什么？能预测什么？在哪些情况下不适用？' }
];

/* ---------- 表单 schema：界面与导出共用同一份 ---------- */
const CFG = {
  task:'教学设计',
  title:'第六周小组教学设计工作台',
  basis:{ prep:'基本教学设计：内容 · 学情 · 目标', activities:'建模实践 M1–M5 与活动安排',
          assess:'学习评价：计划与实施分开', revise:'反馈与修订' },
  sections:[
    { id:'prep', label:'目标与准备', questions:[
      { id:'Q01', label:'本单元需要发展哪些学科理解与实践表现，其课程依据及教学重点是什么？', fields:[
        { key:'unit',      label:'单元或课题名称', control:'text' },

const joinKeyFor = cls => 'ktpt_v16_join_' + cls;
function fnv (s) { let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16); }
function readDigest (k) {
  try { const o = JSON.parse(localStorage.getItem(k) || 'null'); return o && o.digest ? o : null; }
  catch (e) { return null; }
}
function putDigest (k, v) { const salt = Math.random().toString(36).slice(2, 12);
  localStorage.setItem(k, JSON.stringify({ salt, digest: fnv(v + ':' + salt) })); }
const passState = () => !!readDigest(ADMIN_KEY);
const setPass = p => putDigest(ADMIN_KEY, p);
const checkPass = p => { const o = readDigest(ADMIN_KEY); return !!(o && fnv(p + ':' + o.salt) === o.digest); };
function setJoin (code, cls) { putDigest(joinKeyFor(cls), code);
  try { sessionStorage.setItem(JOIN_VIEW_KEY, JSON.stringify({ cls, code })); } catch (e) { /* 写不进去只影响当场复查 */ } }
const joinCode = (cls) => { try { const o = JSON.parse(sessionStorage.getItem(JOIN_VIEW_KEY) || 'null');
  return o && o.cls === cls ? o.code || '' : ''; } catch (e) { return ''; } };
function checkJoin (code, cls) { const o = readDigest(joinKeyFor(cls));
  return o ? fnv(code + ':' + o.salt) === o.digest : code === (CLASS_CODES[cls] || ''); }
const joinFp = (cls) => { const o = readDigest(joinKeyFor(cls || '')); return o ? o.digest : 'preset'; };
function readSess () { try { return JSON.parse(sessionStorage.getItem(SESS_KEY) || 'null') || {}; } catch (e) { return {}; } }
function writeSess (s) { sessionStorage.setItem(SESS_KEY, JSON.stringify(s)); }

const toLocalInput = ts => fmtTime(ts).replace(' ', 'T');

const short = (s, n) => { const t = String(s || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
const splitList = s => String(s || '').split(/[、,，;；\s]+/).map(x => x.trim()).filter(Boolean);

/* 本机可能还存着早期示例种子（示例班级A / 国优计划2班 / 示例成员…）。
   组归属现在由第一次登录写定，识别出「仍是示例种子」时清成未写定；
   旧版本把组号写死成名单里的某一组，存量内容确实属于那组，就按已写定保留。
   小组自行改过的班级名与成员不在替换范围内。 */
function migrateRoster () {
  const g = db.group || (db.group = blankDb().group);
  const mm = db.atoms && db.atoms['project.members_manual'];
  const manual = mm ? splitList(mm.text) : [];
  if (g.assigned) return false;
  const demo = /示例班级|^国优计划2班$|^国优计划班级$/.test(g.className || '') ||
    ((g.members || []).length > 0 && g.members.every(m => DEMO_NAMES.indexOf(m) >= 0)) ||
    (manual.length > 0 && manual.every(m => DEMO_NAMES.indexOf(m) >= 0));
  let changed = false;
  if (demo) {
    g.className = GROUP_SEED.className; g.groupNo = ''; g.members = []; g.assigned = false;
    if (manual.length && manual.every(m => DEMO_NAMES.indexOf(m) >= 0)) mm.text = '';
    changed = true;
  } else if (g.groupNo && CLASS_NAMES.some(cn => classRoster(cn)[g.groupNo])) { g.assigned = true; changed = true; }
  return changed;
}
/* 更早的示例数据用「林小满／陈子昂」充当记录人与快照成员：看着像真名，又不带「示例」，
   教师端研究包会原样带走。这两个取值只可能来自示例种子，所以按整词换成示例成员；
   小组自己写过的内容不在替换表里，一律不动。载入示例数据早已不再产生这两个名字。 */
const STALE_DEMO_NAMES = { '林小满':'示例成员A', '陈子昂':'示例成员B' };
function fixStaleNames () {
  let hit = 0;
  const swap = s => s.split(/([、，,;；\s]+)/).map(p => STALE_DEMO_NAMES[p] || p).join('');
  const walk = v => {
    if (typeof v === 'string') {
      if (STALE_DEMO_NAMES[v]) { hit++; return STALE_DEMO_NAMES[v]; }
      if (/林小满|陈子昂/.test(v)) { const n = swap(v); if (n !== v) { hit++; return n; } }
      return v;
    }
    if (Array.isArray(v)) { v.forEach((x, i) => { v[i] = walk(x); }); return v; }
    if (v && typeof v === 'object') { Object.keys(v).forEach(k => { v[k] = walk(v[k]); }); return v; }
    return v;
  };
  walk(db);
  return hit > 0;
}

function load () {
  const raw = localStorage.getItem(DB_KEY);
  if (!raw) return false;
  try { const o = JSON.parse(raw); db = Object.assign(blankDb(), o);
        db.cards = Object.assign({ goals:[], acts:[], assess:[], fb:[] }, o.cards || {});
        if (!db.rounds) db.rounds = { 1:blankRound(), 2:blankRound() };
        if (!db.rounds[1]) db.rounds[1] = blankRound();
        if (!db.rounds[2]) db.rounds[2] = blankRound();
        /* 早期版本的决定记录用的是另一套字段，挂不上现在的位置：另存一份，不冒充新结构记录也不丢 */
        const all = Array.isArray(o.decisions) ? o.decisions : [];
        db.decisions = all.filter(d => d && typeof d.target === 'string');
        db.legacyDecisions = all.filter(d => !d || typeof d.target !== 'string');
        const m0 = migrateRounds(), m1 = migrateRoster(), m2 = fixStaleNames();
        if (m0 || m1 || m2) localStorage.setItem(DB_KEY, JSON.stringify(db));
  } catch (e) { return false; }
  return true;
}
function migrateRounds () {
  if (!db.atoms) return false;
  const teachingKeys = Object.keys(db.atoms).filter(k => isRoundKey(k));
  if (!teachingKeys.length) return false;
  const r1 = db.rounds[1];
  teachingKeys.forEach(k => { r1.atoms[k] = db.atoms[k]; delete db.atoms[k]; });
  STORES.forEach(s => {
    if (db.cards[s] && db.cards[s].length) {
      r1.cards[s] = db.cards[s].slice();
    }
  });
  ['G','A','E','B'].forEach(p => {
    if (db.seq[p]) { r1.seq[p] = db.seq[p]; }
  });
  return true;
}
function save (quiet) {
  db._rev = (db._rev || 0) + 1;
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); dirty = false; setSaveState('saved'); }
  catch (e) { setSaveState('failed'); return false; }
  if (!quiet && chan) chan.postMessage({ type:'db', from:TAB });

    saveStudentData(db.group.className, db.group.groupNo, ME, { atoms: db.atoms, cards: db.cards, rounds: db.rounds }).catch(() => {});
  }
  return true;
}
let saveTimer = null, dirty = false;
function persist () { dirty = true; setSaveState('saving'); clearTimeout(saveTimer); saveTimer = setTimeout(() => save(), 400); }

/* ---------- 第三周工作台内容的只读共享 ---------- */

/* ---------- 原子读写与留痕 ---------- */
const ROUND_KEY_RE = /^(Q\d+\.|goals\.|acts\.|assess\.|fb\.)/;
const isRoundKey = k => ROUND_KEY_RE.test(k);
const rAtoms = () => { if (!db.rounds) db.rounds = { 1:blankRound(), 2:blankRound() }; return db.rounds[ui.round || 1].atoms; };
const rCards = () => { if (!db.rounds) db.rounds = { 1:blankRound(), 2:blankRound() }; return db.rounds[ui.round || 1].cards; };
const rSeq = () => { if (!db.rounds) db.rounds = { 1:blankRound(), 2:blankRound() }; return db.rounds[ui.round || 1].seq; };
const atomStore = k => isRoundKey(k) ? rAtoms() : db.atoms;
const get = k => ((atomStore(k)[k] || {}).text || '');
const meta = k => atomStore(k)[k] || null;
const isFilled = k => String(get(k)).trim() !== '';
const listVal = k => splitList(get(k));

function put (k, value, opts = {}) {
  if (readOnlyView() || teacherMode() || !ME) return;
  const store = atomStore(k);
  const prev = get(k), cur = store[k];
  if (cur && cur.text === value && !opts.force) return;
  if (conflicts[k] && !opts.resolve) return;
  const t = now();
  store[k] = { text:value, by:ME, at:t };
  if (prev !== value) record(k, prev, value, t, opts.source || '填写');
  logEdit(k, prev, value, t);
  persist();
}
function logEdit (k, prev, next, t) {
  const last = db.revisions[0];
  if (last && last.key === k && last.by === ME && last.round === (ui.round || 1) && t - last.at < 90000) { last.next = next; last.at = t; last.count = (last.count || 1) + 1; return; }
  db.revisions.unshift({ id:'R' + (++db.seq.R), key:k, label:labelOf(k), prev, next, by:ME, at:t, count:1, round:ui.round || 1, promptSchemaVersion: PROMPT_SCHEMA });
}
function record (k, prev, next, t, source) { if (source !== '填写') logActivity(`${source}：${labelOf(k)}`); }
function logActivity (text) {
  db.activity.unshift({ by:actor(), at:now(), text, round:ui.round || 1 });
  if (db.activity.length > 400) db.activity.length = 400;
}

/* ---------- 键 → 人话标签 ---------- */
const QINDEX = {}, SCFG = {};
CFG.sections.forEach(sec => sec.questions.forEach(q => {
  QINDEX[q.id] = { sec, q };
  if (q.control === 'cards') SCFG[q.store] = { q, secLabel:sec.label };
}));
function parseKey (k) {
  let m = k.match(/^project\.(.+)$/);                if (m) return { type:'project', field:m[1] };
  m = k.match(/^(Q\d+)\.([^#]+)$/);                  if (m) return { type:'field', q:m[1], field:m[2] };
  m = k.match(/^([a-z]+)\.([A-Z]\d+)\.(.+)$/);       if (m && STORES.includes(m[1])) return { type:'card', store:m[1], id:m[2], field:m[3] };
  m = k.match(/^([a-z]+)\.([A-Z]\d+)$/);             if (m && STORES.includes(m[1])) return { type:'cardRef', store:m[1], id:m[2] };
  return { type:'question', q:k };
}
const FIELD_OF = (store, key) => (SCFG[store] ? SCFG[store].q.fields.find(f => f.key === key) : null);
function fieldCfg (k) {
  const p = parseKey(k);
  if (p.type === 'project') return CFG.project.find(x => x.key === p.field);
  if (p.type === 'field')   { const i = QINDEX[p.q]; return i && i.q.fields.find(x => x.key === p.field); }
  if (p.type === 'card')    return FIELD_OF(p.store, p.field);
  return null;
}
function zhOpt (f, v) { const o = ((f && f.options) || []).find(x => x.v === v); return o ? o.l : ''; }
function dispVal (k, text) {
  if (!text) return text;
  const f = fieldCfg(k);
  if (!f) return text;
  if (f.control === 'm_chips') return chipText(text);
  if (f.options) return zhOpt(f, text) || text;
  if (f.control === 'func_select') return funcLabel(text);
  if (f.control === 'prev_select') return prevLabel(text);
  if (f.control === 'snap_select') return text === 'none' ? '不继承，本轮从零开始' : text;
  if (f.control === 'goal_multi' || f.control === 'func_multi' || f.control === 'link_multi') return refCodesText(text);
  return text;
}
function labelOf (k) {
  const p = parseKey(k);
  if (p.type === 'project') { const f = CFG.project.find(x => x.key === p.field); return '基本信息 · ' + (f ? f.label : p.field); }
  if (p.type === 'field')   { const i = QINDEX[p.q]; const f = i && i.q.fields.find(x => x.key === p.field);
                              return secLabel(p.q) + ' · ' + (f && i ? fLabel(i.q, f) : p.field); }
  if (p.type === 'card')    { const f = FIELD_OF(p.store, p.field); const cq = SCFG[p.store] ? SCFG[p.store].q : null;
                              return SCFG[p.store].secLabel + ' · ' + cardTitle(p.store, p.id) + ' · ' + (f && cq ? fLabel(cq, f) : p.field); }
  if (p.type === 'cardRef') return SCFG[p.store].secLabel + ' · ' + cardTitle(p.store, p.id);
  const i = QINDEX[k]; return i ? secLabel(k) + ' · ' + qLabel(i.q) : k;
}
function secLabel (qid) { const i = QINDEX[qid]; return i ? i.sec.label : qid; }
function cardTitle (store, id) {
  const t = get(store + '.' + id + '.' + TITLE_FIELD[store]);
  return STORE_WORD[store] + ' ' + id + (t ? '「' + short(t, 16) + '」' : '');
}
/* 关联编号（目标 / 活动 / 评价 / 材料）显示成人话 */
function refCodesText (s) {
  return splitList(s).map(c => {
    if (/^G\d+$|^A\d+$|^E\d+$|^B\d+$/.test(c)) return c;
    if (/^S\d+$/.test(c)) { const m = db.materials.find(x => x.id === c); return c + (m ? '（' + matName(m) + '）' : ''); }
    if (/^PD-S\d+$/.test(c)) return c + '（平台开发工作台）';
    if (/^F\d+$/.test(c)) return refFuncName(c);
    if (/^(goals|acts|assess|fb)\./.test(c)) { const p = parseKey(c); return cardTitle(p.store, p.id); }
    return c;
  }).join('；') || NODATA;
}
const chipText = s => splitList(s).map(v => { const m = M_PRACTICE.find(x => x.v === v); return m ? m.v + ' ' + m.short : v; }).join('、');
const funcLabel = v => !v ? '' : v === 'none' ? '本活动不用平台' : refFuncName(v);
function prevLabel (v) {
  if (!v) return '';
  if (v === 'none') return '不用前一项成果';
  const id = v.replace(/#.*$/, '');
  if (v.endsWith('#model')) return '用 ' + id + ' 的模型';
  if (v.endsWith('#data'))  return '用 ' + id + ' 的数据';
  if (v.endsWith('#out'))   return '用 ' + id + ' 的成果';
  return '用 ' + id + ' 的成果';
}

/* ---------- 卡片增删与排序 ---------- */
const cardsOf = store => rCards()[store] || [];
function nextId (store) {
  const p = SCFG[store].q.prefix;
  const rs = rSeq();
  return p + String(++rs[p]).padStart(2, '0');
}
function addCard (store, preset) {
  const id = nextId(store);
  rCards()[store].push(id);
  db.createdBy[id] = { by:ME, at:now() };
  if (preset) Object.entries(preset).forEach(([k, v]) => { rAtoms()[store + '.' + id + '.' + k] = { text:v, by:ME, at:now() }; });
  logActivity('增加' + STORE_WORD[store] + ' ' + id);
  save(); return id;
}
/* 删除可撤销：内容暂存本页，历史不删 */
const trash = {};
function delCard (store, id) {
  const ra = rAtoms(), rc = rCards();
  const i = (rc[store] || []).indexOf(id); if (i < 0) return;
  const atoms = {};
  Object.keys(ra).filter(k => k.startsWith(store + '.' + id + '.')).forEach(k => atoms[k] = ra[k]);
  trash[store + '.' + id] = { at:now(), index:i, atoms, refs:db.refs[store + '.' + id] || null, by:ME, round:ui.round || 1 };
  rc[store].splice(i, 1);
  Object.keys(atoms).forEach(k => delete ra[k]);
  delete db.refs[store + '.' + id];
  logActivity('删除 ' + cardTitle(store, id) + '（可撤销，修改历史保留）');
  save();
}
function undoDelCard (store, id) {
  const t = trash[store + '.' + id]; if (!t) return false;
  const savedRound = ui.round;
  ui.round = t.round || 1;
  rCards()[store].splice(Math.min(t.index, rCards()[store].length), 0, id);
  Object.assign(rAtoms(), t.atoms);
  if (t.refs) db.refs[store + '.' + id] = t.refs;
  ui.round = savedRound;
  delete trash[store + '.' + id];
  logActivity('撤销删除：' + STORE_WORD[store] + ' ' + id);
  save(); return true;
}
function dupCard (store, id) {
  const ra = rAtoms(), rc = rCards();
  const nid = nextId(store), from = store + '.' + id + '.', to = store + '.' + nid + '.';
  Object.keys(ra).filter(k => k.startsWith(from)).forEach(k => {
    const f = k.slice(from.length);
    if (['owner','goals','sim_teacher'].includes(f)) return;
    ra[to + f] = { text:ra[k].text, by:ME, at:now() };
  });
  const nm = to + 'name';
  if (isFilled(nm)) ra[nm] = { text:get(nm) + '（副本）', by:ME, at:now() };
  if (db.refs[from.slice(0, -1)] && db.refs[from.slice(0, -1)].length) db.refs[to.slice(0, -1)] = db.refs[from.slice(0, -1)].slice();
  rc[store].splice(rc[store].indexOf(id) + 1, 0, nid);
  db.createdBy[nid] = { by:ME, at:now() };
  logActivity('复制出 ' + nid + '（负责人与关联目标没有跟着复制，需要重新选）');
  save(); return nid;
}
function moveCard (store, id, dir) {
  const list = rCards()[store], i = list.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
  logActivity('调整顺序：' + cardTitle(store, id) + ' → 第 ' + (j + 1) + ' 项（编号不变，关联按编号保留）');
  save();
}

  const made = M_PRACTICE.map(m => addCard('acts', { name:m.short, practices:m.v }));

/* ---------- 关键决定（04 §五）：三问常驻，其余按需展开 ---------- */
const DEC_SOURCES = ['自己操作时看到的', '组员的说法', '材料或数据', '检查记录的结果', '教师或助教的意见', 'AI 给出的建议', '其他'];
function nextSeq (k) { db.seq[k] = (db.seq[k] || 0) + 1; return db.seq[k]; }
const decisionsOf = target => db.decisions.filter(d => d.target === target);
/* 事件时间与记录时间分开存：是否算「补记」由两者差值现算，不另存一个会过期的标记 */
function decTiming (d) {
  if (!d.event_at) return { state:'事件时间未填', tag:'s0' };
  const ev = new Date(d.event_at).getTime();
  if (!isFinite(ev)) return { state:'事件时间没填对', tag:'s1' };
  const h = (d.at - ev) / 3600000;
  if (h < -1) return { state:'事件时间晚于记录时间，请核对', tag:'s1' };
  return h > 24 ? { state:'补记（距事件约 ' + Math.round(h / 24) + ' 天）', tag:'s1' }
                : { state:'当场记录', tag:'s3' };
}
function addDecision (target, form) {
  const t = s => String(form[s] || '').trim();
  if (!t('problem') && !t('decision') && !t('reason')) return { err:'三个问题至少写一项，空记录不入库' };
  const id = 'D' + String(nextSeq('D')).padStart(2, '0');
  db.decisions.push({ id, target, target_label:labelOf(target),
    problem:t('problem'), decision:t('decision'), reason:t('reason'),
    sources:(form.sources || []).slice(), participants:(form.participants || []).slice(),
    alternates:t('alternates'), check_plan:t('check_plan'), event_at:t('event_at'),
    by:ME, at:now(), src:'学生填写', win:TASK_LABEL });
  logActivity('记录一次决定（' + id + '）：' + labelOf(target));
  save(); return { id };
}
function delDecision (id) {
  const d = db.decisions.find(x => x.id === id); if (!d) return;
  db.decisions = db.decisions.filter(x => x.id !== id);
  logActivity('删除决定记录 ' + id + '：' + d.target_label);
  save();
}

  view:'workbench', snapCode:null, showSnaps:false, modal:null, firstVisit:!localStorage.getItem(DB_KEY) };

let focusKey = null, myDraft = '';
const conflicts = {};
function allAtoms () { return Object.assign({}, rAtoms(), db.atoms); }
let snapshotBeforeRemote = JSON.parse(JSON.stringify(allAtoms()));
function mergeRemote () {
  const before = snapshotBeforeRemote;
  load();
  const touched = {};
  Object.keys(allAtoms()).forEach(k => {
    const a = before[k], b = atomStore(k)[k];
    if (b && (!a || a.text !== b.text) && b.by !== ME) touched[k] = b;
  });
  snapshotBeforeRemote = JSON.parse(JSON.stringify(allAtoms()));
  if (focusKey && touched[focusKey])
    conflicts[focusKey] = { by:touched[focusKey].by, at:touched[focusKey].at, theirs:touched[focusKey].text, mine:myDraft };
  render();
}
function resolveConflict (key, how) {
  const c = conflicts[key]; if (!c) return;
  const store = atomStore(key);
  if (how === 'theirs') store[key].text = c.theirs;
  else {
    const joiner = document.getElementById(kid(key)) && document.getElementById(kid(key)).tagName === 'TEXTAREA' ? '\n' : '；';
    const merged = how === 'both' && c.theirs !== c.mine ? c.theirs + joiner + c.mine : c.mine;
    store[key] = { text:merged, by:ME, at:now() };
    db.revisions.unshift({ id:'R' + (++db.seq.R), key, label:labelOf(key), prev:c.theirs, next:merged, by:ME, at:now(), count:1 });
  }
  delete conflicts[key];
  logActivity('处理同框冲突：' + labelOf(key));
  save(); render();
}

function withData (data, fn) {
  const keys = ['atoms', 'cards', 'materials', 'refs', 'decisions', 'rounds'], backup = {};
  keys.forEach(k => backup[k] = db[k]);
  keys.forEach(k => db[k] = JSON.parse(JSON.stringify(data[k] == null ? blankDb()[k] : data[k])));
  if (data.roundAtoms || data.roundCards) {
    const rd = parseInt(data.round) || ui.round || 1;
    if (!db.rounds) db.rounds = { 1:blankRound(), 2:blankRound() };
    if (data.roundAtoms) db.rounds[rd].atoms = JSON.parse(JSON.stringify(data.roundAtoms));
    if (data.roundCards) db.rounds[rd].cards = JSON.parse(JSON.stringify(data.roundCards));
  }
  try { fn(); } finally { keys.forEach(k => db[k] = backup[k]); }
}

function secCount (s) {
  let filled = 0, total = 0;
  s.questions.forEach(q => {
    if (q.control === 'cards') { total += 1; if (cardsOf(q.store).length) filled += 1; return; }
    (q.fields || []).forEach(f => {
      if (f.optional || f.disclosure) return;
      total += 1;
      /* 带默认值的下拉：没有存过值就只算显示默认，不计入已填 */
      if (isFilled(q.id + '.' + f.key)) filled += 1;
    });
  });
  return filled ? `<i>${filled}/${total}</i>` : '';
}

  const s = CFG.sections.find(x => x.id === ui.section);

function copyRound1to2 () {
  const r1 = db.rounds[1], r2 = db.rounds[2];
  const idMap = {};
  STORES.forEach(s => {
    r1.cards[s].forEach(oldId => {
      const p = SCFG[s].q.prefix;
      const newId = p + String(++r2.seq[p]).padStart(2, '0');
      idMap[s + '.' + oldId] = s + '.' + newId;
      r2.cards[s].push(newId);
    });
  });
  Object.keys(r1.atoms).forEach(k => {
    let nk = k;
    Object.keys(idMap).forEach(old => { if (k.startsWith(old + '.')) nk = k.replace(old, idMap[old]); });
    r2.atoms[nk] = Object.assign({}, r1.atoms[k]);
  });
  logActivity('沿用第一轮方案到第二轮');
  save();
}

/* 同一组选填条目合成一个按需展开区，不重复出现同样的展开标题 */
function fieldsHtml (q, fields, store, id) {
  const out = [];
  for (let i = 0; i < fields.length;) {
    const f = fields[i];
    if (!f.disclosure) { out.push(store ? cardFieldView(q, id, f) : fieldView(q, f)); i++; continue; }
    const group = f.disclosure, run = [];
    while (i < fields.length && fields[i].disclosure === group) { run.push(fields[i]); i++; }
    const base = store ? q.store + '.' + id : q.id;
    const open = run.some(x => isFilled(base + '.' + x.key));
    out.push(`<details class="dis"${open ? ' open' : ''}><summary>${esc(group)}</summary>
      <div style="padding-top:8px">${run.map(x => store ? cardFieldView(q, id, x) : fieldView(q, x)).join('')}</div></details>`);
  }
  return out.join('');
}
function fieldView (q, f) {
  const key = q.id + '.' + f.key;
  return `<div class="f"><label for="${kid(key)}">${esc(fLabel(q, f))}${f.optional ? '<span class="opt">（选填）</span>' : ''}</label>
    ${ctl(key, f)}${presenceLine(key)}</div>`;
}
function cardFieldView (q, id, f) {
  const key = q.store + '.' + id + '.' + f.key;
  return `<div class="f"><label for="${kid(key)}">${esc(fLabel(q, f))}${f.optional ? '<span class="opt">（选填）</span>' : ''}</label>
    ${ctl(key, f)}${presenceLine(key)}</div>`;
}
function implStatusVal () { return get('Q09.impl_status') || 'not_yet'; }
function implNotice () {

function timeSummary () {
  const sum = cardsOf('acts').reduce((n, id) => {
    const m = String(get('acts.' + id + '.duration')).match(/(\d+(?:\.\d+)?)/);
    return n + (m ? parseFloat(m[1]) : 0);
  }, 0);
  const filled = cardsOf('acts').filter(id => isFilled('acts.' + id + '.duration')).length;
  const total = cardsOf('acts').length;
  if (!total) return '';
  const period = parseFloat(get('Q01.duration').match(/\d+/)?.[0] || '') || 0;
  const gap = period ? ` · 与所填完整课时 ${period} 分钟相差 ${Math.round((sum - period) * 10) / 10} 分钟` : '';
  return `<div class="hint">已填预计时间的活动 ${filled}/${total} 项，合计 ${sum} 分钟${gap}。</div>`;
}

/* ---------- 通用控件 ---------- */
function ctl (key, f, over = {}) {
  const val = (focusKey === key && conflicts[key]) ? conflicts[key].mine : get(key);
  const dis = (over.disabled || RO) ? ' disabled' : '';
  const id = kid(key), common = `id="${id}" data-k="${esc(key)}"${dis}`;
  const c = f.control;
  if (c === 'textarea') return `<textarea ${common} rows="2" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`;
  if (c === 'select') return `<select ${common} class="${val ? '' : 'empty'}">
      ${f.noDefault ? '<option value="">' + esc(over.placeholder || '请选择') + '</option>' : ''}
      ${f.options.map(o => `<option value="${esc(o.v)}" ${(val || (f.preset && '')) === o.v ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}
    </select>`;
  if (c === 'member_select') {
    const ms = members(), extra = val && ms.indexOf(val) < 0 ? [val] : [];
    return `<select ${common} class="${val ? '' : 'empty'}"><option value="">未选择</option>
      ${ms.concat(extra).map(m => `<option value="${esc(m)}" ${val === m ? 'selected' : ''}>${esc(m)}${ms.indexOf(m) < 0 ? '（名单外）' : ''}</option>`).join('')}</select>`;
  }
  if (c === 'member_multi') {
    const ms = members(), extra = splitList(val).filter(m => ms.indexOf(m) < 0);
    return multiChecks(key, ms.map(m => [m, m]).concat(extra.map(m => [m, m + '（名单外）'])), val, dis);
  }
  if (c === 'goal_multi') {
    const gs = cardsOf('goals');
    if (!gs.length) return (val ? `<input type="text" ${common} value="${esc(val)}">` : '')
      + emptyState('还没有目标', '先在「目标与准备」里点「添加目标」。');
    return multiChecks(key, gs.map(g => [g, g + ' ' + (get('goals.' + g + '.goal') || '未写内容')]), val, dis);
  }
  if (c === 'func_multi') {
    const fs = refFuncs();
    if (!fs.length) return `<input type="text" ${common} value="${esc(val)}" placeholder="没有读到功能记录，可直接写功能名称">
`;
    return multiChecks(key, fs.map(x => [x.id, x.id + ' ' + (x.name || '未命名功能')]), val, dis);
  }
  if (c === 'func_select') {
    const fs = refFuncs();
    if (!fs.length) return `<select ${common}><option value="">未选择</option>
        <option value="none" ${val === 'none' ? 'selected' : ''}>本活动不用平台</option></select>
      <input data-k="${esc(key)}" value="${esc(val && val !== 'none' ? val : '')}" placeholder="没有登记功能时，在这里写功能名称" style="margin-top:6px">
`;
    return `<select ${common} class="${val ? '' : 'empty'}"><option value="">未选择</option>
      <option value="none" ${val === 'none' ? 'selected' : ''}>本活动不用平台</option>
      ${fs.map(x => `<option value="${esc(x.id)}" ${val === x.id ? 'selected' : ''}>${esc(x.id + ' ' + (x.name || '未命名功能'))}</option>`).join('')}</select>`
      + (val && val !== 'none' ? `<div class="hint">${esc(funcProgress(val))}</div>` : '');
  }
  if (c === 'm_chips') {
    const chosen = splitList(val);
    return `<div class="chips" role="group" aria-label="涉及的建模实践">
      ${M_PRACTICE.map(m => `<button type="button" class="chip" data-m="${esc(key)}" data-v="${m.v}"
        aria-pressed="${chosen.includes(m.v)}"${dis}>${m.v}<span class="h">${esc(m.short)}</span></button>`).join('')}</div>`;
  }
  if (c === 'prev_select') {
    const others = cardsOf('acts').filter(x => !(key.startsWith('acts.') && key.split('.')[1] === x));
    if (!others.length) return emptyState('还没有其他活动可衔接', '先添加活动，再回来选前一项成果。');
    const id = key.split('.')[1], base = get(key).replace(/#.*$/, ''), tail = get(key).includes('#') ? '#' + get(key).split('#')[1] : '';
    return `<select ${common} class="${get(key) ? '' : 'empty'}" data-k="${esc(key)}">
        <option value="">未选择</option><option value="none" ${get(key) === 'none' ? 'selected' : ''}>不用前一项成果</option>
        ${others.map(x => `<option value="${esc(x + '#out')}" ${base === x ? 'selected' : ''}>用 ${esc(x)} 的成果</option>`).join('')}</select>`
      + (base && base !== 'none' ? `<select id="${esc(id)}-need-kind" aria-label="要 ${esc(base)} 的哪一部分产出" class="" style="margin-top:6px" data-k="${esc(key)}"${dis}>
          ${[['#model', '它的模型'], ['#data', '它的数据'], ['#var', '它的变量表'], ['#out', '它的成果']]
            .map(([v, l]) => `<option value="${esc(base + v)}" ${tail === v ? 'selected' : ''}>${l}</option>`).join('')}</select>` : '');
  }
  if (c === 'link_multi') {
    const items = cardsOf('goals').map(g => ['goals.' + g, cardTitle('goals', g)])
      .concat(cardsOf('acts').map(a => ['acts.' + a, cardTitle('acts', a)]))
      .concat(cardsOf('assess').map(e => ['assess.' + e, cardTitle('assess', e)]))
      .concat(db.materials.map(m => [m.id, '材料 ' + m.id + '（' + matName(m) + '）']));
    if (!items.length) return emptyState('还没有可关联的内容', '目标、活动、评价任务或材料添加后会出现在这里。');
    return multiChecks(key, items, val, dis);
  }
  if (c === 'snap_select') {
    return `<select ${common} class="${val ? '' : 'empty'}"><option value="">未选择</option>
      <option value="none" ${val === 'none' ? 'selected' : ''}>不继承，本轮从零开始</option>
      ${db.snaps.map(s => `<option value="${esc(s.code)}" ${val === s.code ? 'selected' : ''}>${esc(s.code)}（教案 ${esc(s.lessonVersion)} · ${esc(fmtTime(s.at))}）</option>`).join('')}</select>`;
  }
  if (c === 'version_select') {

/* 调试访问器：供验收自测核对协作与共享状态（只读，不影响界面） */
window.__dbg = () => ({ me:ME, tab:TAB, sess:readSess(), assigned:!!db.group.assigned,
  groupNo:db.group.groupNo, className:db.group.className, machine:machineGroup(), machineClass:machineClass(),
  joinFp:joinFp(db.group.className || '科教班'), passSet:passState(),
  view:ui.view, section:ui.section, role:isTeacher() ? 'teacher' : 'student',
  cards:STORES.reduce((o, s) => (o[s] = rCards()[s].slice(), o), {}), counts:STORES.reduce((o, s) => (o[s] = cardsOf(s).length, o), {}),
  round:ui.round, roundAtoms:Object.keys(rAtoms()).length, projectAtoms:Object.keys(db.atoms).length,
  refLoaded:!!ref, refFuncs:refFuncs().map(f => f.id + ':' + (f.status || '')), refMats:ref ? ref.mats.length : 0,
  members:members(), conflicts:Object.keys(conflicts), presence:freshPresence().map(p => p.by + '→' + p.key),
  implStatus:implStatusVal(), implFilled:implFilled(), pendingImpl, trash:Object.keys(trash),
  mats:db.materials.length, refs:Object.keys(db.refs).length, snaps:db.snaps.length, rev:db._rev,
  decisions:db.decisions.map(d => d.id + '→' + d.target + '·' + decTiming(d).state), decDraftKeys:Object.keys(ui.decDraft),
  legacyDecisions:(db.legacyDecisions || []).length,
  teacherTasks:{ open:openPersonalTasks().map(m => m.id + ':' + (m.name || '')), waiting:waitingPersonalTasks().length,
                 registered:tasksFromTeacher().length },
  personal:db.personal.map(p => p.id + '·' + p.msr + '·' + p.by + '·' + (p.state || '未选')) });

function boot () {
  localStorage.removeItem(ME_KEY);          // 旧版本把身份存在本机共享键里，界面自选身份已废除
  /* 上一版「自设班级码」的校验值搬到科教班互动码键，教师换过码的机器不丢 */
  const oldClass = readDigest(CLASS_KEY);
  if (oldClass && !readDigest(joinKeyFor('科教班'))) { localStorage.setItem(joinKeyFor('科教班'), JSON.stringify(oldClass)); }
  /* 更早版本用单一 JOIN_KEY 存互动码，搬到科教班键 */
  const oldJoin = readDigest(JOIN_KEY);
  if (oldJoin && !readDigest(joinKeyFor('科教班'))) { localStorage.setItem(joinKeyFor('科教班'), JSON.stringify(oldJoin)); }
  localStorage.removeItem(CLASS_KEY);
  localStorage.removeItem(JOIN_KEY);
  ref = readRef();
  const had = load();
  if (!had) { db = blankDb(); save(true); }
  if (syncGroupFromRef()) save(true);
  /* 两扇门凭据层：教师门在管理密码被清掉时作废；学生门的互动码指纹对不上时作废 */
  const s = readSess();
  if (s.door === 'teacher' && !passState()) clearSess();
  else if (s.code && s.cls && s.jk !== joinFp(s.cls)) clearSess();
  snapshotBeforeRemote = JSON.parse(JSON.stringify(db.atoms));
  applySess();
  const meInfo = ME ? groupOf(ME) : null;
  if (ME && machineGroup() && (!meInfo || meInfo.group !== machineGroup())) { sessCodeOk(meInfo ? meInfo.class : '科教班'); ME = ''; }
  if (isTeacher() && ui.view === 'workbench') ui.view = 'teacherGroups';
  render();
  setSaveState('saved');
}
boot();
/* 在线标记 9 秒过期：聚焦期间每 5 秒重新广播位置，并只刷新在线与冲突片段 */
setInterval(() => { if (focusKey) announce(focusKey); refreshPresence(); }, 5000);
/* 页面离开前把尚未落盘的输入写入；无改动时不回写，避免覆盖其他标签页的新内容 */
window.addEventListener('beforeunload', () => { if (dirty) { clearTimeout(saveTimer); save(); } });
</script>
</body>
</html>
