<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第三周小组平台开发工作台</title>
<style>
:root{
  --fg:#26333f; --mut:#657382; --line:#d8e1e8; --bg:#f4f6f8; --card:#fff;
  --pri:#466b8a; --pri-bg:#edf2f6; --ok:#52745f; --warn:#966b34; --bad:#a95f58;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer}
a{color:var(--pri)}

/* ---------- 顶栏 ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px}
.bar-in{max-width:980px;margin:0 auto}
.row1{display:flex;gap:10px 18px;align-items:flex-start;flex-wrap:wrap}
.grp-name{font-size:16px;font-weight:600}
.grp-facts{display:flex;gap:2px 14px;flex-wrap:wrap;font-size:14px;color:var(--mut);flex:1;min-width:200px}
.grp-facts b{color:var(--fg);font-weight:500}
.row2{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.spacer{flex:1}
.save-state{font-size:14px;color:var(--mut)}
.save-state.ok{color:var(--ok)} .save-state.bad{color:var(--bad)}
.who{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
.tasks{display:inline-flex;gap:4px;align-items:center;font-size:14px;color:var(--mut)}
.tasks .now{font-size:14px;padding:5px 11px;border-radius:999px;background:var(--pri-bg);border:1px solid var(--pri);color:var(--pri);font-weight:600}
.tasks a{font-size:14px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mut);background:#fff;text-decoration:none}
.tasks a:hover{color:var(--pri);border-color:var(--pri)}
.btn{font-size:15px;padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--fg)}
.btn:hover{border-color:#b9c9d6;background:#f8fafb}
.btn.pri{border-color:var(--pri);background:var(--pri);color:#fff}
.btn.pri:hover{background:#3b5b76}
.btn.ghost{border-color:transparent;color:var(--pri);background:none;padding:6px 8px}
.btn.sm{font-size:14px;padding:4px 9px}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,
input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,
[tabindex]:focus-visible{outline:2px solid var(--pri);outline-offset:1px}

/* ---------- 空状态 ---------- */
.es{margin:2px 0 12px}
.es b{display:block;font-size:16px;font-weight:600;color:var(--fg)}
.es span{display:block;font-size:13px;color:var(--mut);max-width:440px;margin-top:3px}

/* ---------- 入口：两扇门 ---------- */
.gate{max-width:420px;margin:0 auto;padding:54px 20px 60px}
.gate h1{font-size:19px;font-weight:600;margin:0 0 6px}
.gate .lead,.lead{font-size:13px;color:var(--mut);margin:0 0 18px}
.gate .fld,.fld{font-size:14px;font-weight:600;color:var(--mut);margin:0 0 7px}
.doors{display:grid;gap:12px}
.door{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 17px;color:var(--fg)}
.door:hover{border-color:var(--pri)}
.door b{display:block;font-size:16px;font-weight:600}
.door span{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.gate input.pw{display:block;width:100%;padding:11px 13px;font-size:16px;margin:0 0 14px;
  border:2px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--fg)}
.gate input.pw:focus{outline:none;border-color:var(--pri)}
.codes{display:flex;gap:10px;justify-content:center;margin:0 0 16px}
.codes input.code{width:64px;height:72px;text-align:center;font-size:2rem;font-weight:600;padding:0;
  border:2px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--fg)}
.codes input.code:focus{outline:none;border-color:var(--pri)}
.go{display:block;width:100%;font-size:15px;padding:11px 14px;border:1px solid var(--pri);
  background:var(--pri);color:#fff;border-radius:8px}
.go:hover{background:#3b5b76}
.err{display:none;margin:0 0 14px;padding:8px 11px;font-size:13px;color:#b91c1c;
  background:#f8eeee;border:1px solid #fca5a5;border-radius:8px}
.err.on{display:block}
.pick{display:grid;gap:10px;margin-top:4px}
.pgrp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.pgrp b{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:7px}
.pms{display:flex;gap:8px;flex-wrap:wrap}
.pms button{font-size:15px;padding:7px 13px;border:1px solid var(--line);background:#fff;
  border-radius:999px;color:var(--fg)}
.pms button:hover{border-color:var(--pri);color:var(--pri)}
.pgrp.mine{border-color:var(--pri)}
.pgrp.out b,.pgrp.out .pms button{color:var(--mut)}
.pgrp.out .pms button{background:#f7f9fa;cursor:default}
.pgrp.out .pms button:hover{border-color:var(--line);color:var(--mut)}

/* ---------- 容器 ---------- */
.wrap{max-width:980px;margin:0 auto;padding:14px 20px 100px}

/* ---------- 项目信息 ---------- */
.proj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.proj-hd{display:flex;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;font-size:15px;list-style:none}
.proj-hd::-webkit-details-marker{display:none}
.proj-hd::before{content:"⌄";color:var(--mut);font-size:12px}
.proj:not([open]) .proj-hd::before{content:"›"}
.proj-hd .sum{color:var(--mut);font-size:14px;flex:1}
.proj-bd{padding:2px 16px 14px;border-top:1px solid var(--line);display:grid;gap:12px 18px;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

/* ---------- 四个入口 ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:0;list-style:none}
.tab{font-size:15px;padding:7px 14px;border:1px solid var(--line);background:var(--card);border-radius:999px;color:var(--mut)}
.tab[aria-selected=true]{border-color:var(--pri);background:var(--pri-bg);color:var(--pri);font-weight:600}
.tab i{font-style:normal;font-size:13px;opacity:.85;margin-left:6px}

/* ---------- 题目卡片 ---------- */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.q>h2{font-size:17px;margin:0 0 12px;font-weight:600;line-height:1.45}
.f{margin:0 0 12px}
.f:last-of-type{margin-bottom:0}
.f>label,.f>.lab{display:block;font-size:14px;font-weight:600;margin-bottom:4px;color:var(--mut)}
.f .opt{font-size:13px;color:var(--mut);font-weight:normal;margin-left:5px}
input[type=text],textarea,select{font:inherit;font-size:16px;width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--fg)}
textarea{resize:vertical;min-height:60px;line-height:1.6;overflow:hidden}
input::placeholder,textarea::placeholder{color:#8b97a3}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(70,107,138,.18);outline:none}
input:disabled,textarea:disabled,select:disabled{background:#edf2f6;color:#8b97a3;box-shadow:none;border-color:var(--line)}
select.empty{color:#8b97a3}
.two{display:grid;gap:12px 18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

/* ---------- 选填条目折叠 ---------- */
details.dis{margin-top:10px}
details.dis>summary{cursor:pointer;font-size:14px;color:var(--pri);list-style:none}
details.dis>summary::-webkit-details-marker{display:none}
details.dis>summary::before{content:"› ";font-weight:700}
details.dis[open]>summary::before{content:"⌄ "}

/* ---------- 增行表 ---------- */
.rows{width:100%;border-collapse:collapse;margin:2px 0 4px}
.rows th{font-size:14px;color:var(--mut);text-align:left;font-weight:600;padding:0 8px 5px 0}
.rows td{padding:0 8px 8px 0;vertical-align:top}
.rows .rm{white-space:nowrap}
.rows td .by{font-size:13px;color:var(--mut);padding-top:3px}

/* ---------- 功能 / 检查卡 ---------- */
.rec{border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;background:#fbfcfd;overflow:hidden}
.rec>summary{padding:12px 14px;display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap;font-size:16px;list-style:none;cursor:pointer}
.rec>summary::-webkit-details-marker{display:none}
.rec>summary::before{content:"⌄";color:var(--mut);font-size:12px}
.rec:not([open])>summary::before{content:"›"}
.rec>summary b{font-weight:600}
.rec>summary .untitled{color:#8b97a3;font-weight:400}
.rec>summary .end{flex:1}
.rec>.bd{padding:4px 14px 14px;border-top:1px solid var(--line)}
.tag{font-size:13px;background:#edf2f6;color:#41596f;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.s0{background:#e9edf1;color:#657382}
.tag.s1{background:#fbf3e6;color:#966b34}
.tag.s2{background:#dce7ef;color:#466b8a}
.tag.s3{background:#edf4ef;color:#52745f}
.tag.ok{background:#edf4ef;color:#52745f}
.tag.bad{background:#f9eeee;color:#a95f58}
.tag.none{background:#fff;color:#8b97a3;border:1px dashed var(--line)}

/* ---------- 题目底部四个按需入口 ---------- */
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tool{font-size:15px;padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--mut)}
.tool:hover{color:var(--pri);border-color:var(--pri)}
.tool[aria-expanded=true]{background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
.tool .n{font-size:12px;margin-left:4px;opacity:.8}
.panel{margin-top:10px;background:#f8fafb;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.panel h3{font-size:15px;margin:0 0 8px;font-weight:600}
.cmt{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:0 0 10px;font-size:14px}
.cmt .hd{font-size:13px;color:var(--mut)}
.cmt .hd b{color:var(--fg);font-weight:500}
.cmt .hd .tch{color:var(--pri)}
.cmt .rp{margin-left:12px;margin-top:6px}
.dec{border:1px solid var(--line);border-left:3px solid var(--pri);background:#fff;border-radius:8px;padding:10px 12px;margin:0 0 12px}
.dec .hd{font-size:16px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.dec .hd b{color:var(--fg);font-weight:600}
.dec .hd .end{flex:1}
.dec .lab{font-size:16px;color:var(--mut);margin:8px 0 2px}
.dec .val{font-size:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.chk{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:16px}
.chk label{display:flex;gap:6px;align-items:center;font-size:16px}
.ptask{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px;background:#fff}
.ptask .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px;font-weight:600;margin-bottom:2px}
.ptask .facts{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:16px;color:var(--mut);margin:6px 0 10px}
.ptask .facts b{color:var(--fg);font-weight:500}
.mat{display:flex;gap:8px;align-items:baseline;font-size:14px;padding:4px 0;border-bottom:1px dashed #e2e8ee}
.mat:last-child{border-bottom:0}
.mat .end{flex:1}
.hist{font-size:14px;padding:5px 0;border-bottom:1px dashed #e2e8ee}
.hist:last-child{border-bottom:0}
.hist .hd{color:var(--mut);font-size:13px}
.hist .dv{display:grid;gap:4px 10px;grid-template-columns:1fr 1fr;margin-top:4px}
.hist .dv div{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:pre-wrap;word-break:break-word}
.hist .dv .was{color:#8b97a3}
.hist .dv .now{color:var(--fg)}

/* ---------- 同框协作 ---------- */
.presence{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--mut);margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.pchip{background:var(--pri-bg);color:var(--pri);border-radius:999px;padding:1px 8px;font-size:13px}
.conflict{margin-top:8px;background:#f9eeee;border:1px solid #e3c4c0;border-radius:8px;padding:9px 11px;font-size:14px;color:#a95f58}
.conflict .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}

/* ---------- 在线成员 ---------- */
.online{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut);flex-wrap:wrap}

/* ---------- 弹窗 ---------- */
#mask{position:fixed;inset:0;background:rgba(20,26,34,.34);display:flex;align-items:center;justify-content:center;
  z-index:60;padding:20px}
.dlg{background:#fff;border-radius:12px;max-width:820px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.dlg>h2{font-size:17px;margin:0;padding:14px 18px 0}
.dlg .bd{padding:12px 18px;overflow:auto}
.dlg .ft{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
.dlg .ft .end{flex:1}
.dlg pre{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:#f8fafb;
  border:1px solid var(--line);border-radius:8px;padding:12px;max-height:46vh;overflow:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:14px;color:var(--mut);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--pri-bg);color:var(--pri);font-weight:600}
.kv{font-size:14px}
.kv div{padding:3px 0}
.kv b{font-weight:600;color:var(--fg)}

/* ---------- 只读展示版 / 教师端 ---------- */
.ro-badge{display:inline-block;font-size:13px;background:#edf2f6;color:#41596f;border-radius:999px;padding:2px 10px}
.ro textarea,.ro input,.ro select{pointer-events:none}
.glist{display:grid;gap:10px}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;display:flex;
  gap:8px 16px;align-items:center;flex-wrap:wrap;font-size:16px}
.gitem .end{flex:1}
.gitem .sm{font-size:14px;color:var(--mut)}
h1.pg{font-size:22px;margin:4px 0 14px;font-weight:600}
.end{flex:1}
.hint{font-size:13px;color:var(--mut);line-height:1.55}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;background:#26333f;color:#fff;
  font-size:14px;padding:9px 16px;border-radius:8px;max-width:90vw}

/* ---------- 窄屏 ---------- */
@media (max-width:720px){
  body{font-size:16px}
  .bar{padding:10px 14px}
  .wrap{padding:12px 14px 90px}
  .q{padding:16px 14px}
  .q>h2{font-size:18px}
  .proj-bd{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .row1,.row2{gap:8px 10px}
  .tab{font-size:16px;padding:8px 12px}
  .btn{font-size:16px;padding:7px 11px}
  .codes input.code{width:56px;height:64px;font-size:1.7rem}
  .rows,.rows thead,.rows tbody,.rows th,.rows td,.rows tr{display:block;width:100%}
  .rows thead{display:none}
  .rows td{padding:0 0 6px}
  .hist .dv{grid-template-columns:1fr}
  .dlg{max-height:92vh}
}
</style>
<!-- <script type="module" src="../firebase-integration.js"></script> -->
<!-- Firebase 暂时禁用：gstatic.com 在国内访问慢/被墙，导致页面卡住。localStorage 本地存储正常工作。 -->
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" hidden></div>

<script>
/* ============================================================
   第三周小组平台开发工作台 · 原型 v16
   依据 outputs/课程材料v16_第三周工作台/01_给界面设计AI的操作指南.md
   单文件、无依赖、无构建。数据存 localStorage，供同浏览器多标签演示。
   ============================================================ */

/* ---------- 表单 schema：界面与导出共用同一份，避免文案漂移 ---------- */
/* 文案版本标记 blue_form_research_2026_11_23 */
const CFG = {
  week: '第三周',
  title: '第三周小组平台开发工作台',
  promptVersion: 'blue_form_research_2026_11_23',
  practice: { users:'P3 识别与界定计算问题', resources:'P4 开发与使用抽象', functions:'P5 创建计算作品', checks:'P6 测试与改进计算作品' },
  sections: [
    { id:'users', label:'使用者与任务', devCheck:'另一个组员阅读后，能否说清平台要帮谁完成什么任务？若只能说"做一个丰富、美观的平台"，返回细化。', questions:[
      { id:'Q01', label:'使用者与学习任务', fields:[
        { key:'audience',   label:'谁在什么情境下使用平台', control:'textarea', ph:'说明使用者的年级与相关基础。' },
        { key:'user_task',  label:'要完成什么具体学习任务', control:'textarea', ph:'需要查找、比较、选择、操作或保存什么。' },
        { key:'difficulty', label:'现有做法有什么困难', control:'textarea', ph:'区分实际观察和教学预判。' },
        { key:'demand_basis', label:'判断依据是什么', control:'textarea', ph:'关联教材、课标、观察或用户反馈。' },
        { key:'human_platform_boundary', label:'哪些交给平台处理，哪些仍由使用者判断', control:'textarea',
          ph:'检索、匹配或计算可由平台支持，内容是否合适可能需要使用者自己判断。' } ] },
      { id:'Q02', label:'开发范围与分工', fields:[
        { key:'scope',        label:'本周先完成哪些任务', control:'textarea', ph:'全册范围及优先实现内容。' },
        { key:'task_dependencies', label:'任务之间有什么先后或依赖', control:'textarea', ph:'说明哪些任务必须在其他任务之前完成，以及原因。' },
        { key:'assignments', label:'成员分工', control:'rows', addLabel:'添加一行分工',
          cols:[ { k:'member', l:'成员', control:'member_select', width:'160px' },
                 { k:'task',   l:'负责内容', control:'text' },
                 { k:'deliverable', l:'交付内容', control:'text', optional:true } ] },
        { key:'integration', label:'怎样统一格式，整合模块并交叉检查', control:'textarea',
          ph:'说明共同资源格式、公共组件、整合负责人及交叉检查方法。' },
        { key:'deferred_scope', label:'暂时不做什么', control:'textarea', optional:true,
          disclosure:'补充安排', ph:'说明后续内容与原因。' } ] } ] },

    { id:'resources', label:'资源结构', devCheck:'选取两条不同类型的真实资源，能否用该结构记录并找到？不能时先调整格式，再批量录入。', questions:[
      { id:'Q03', label:'全册资源怎样组织', fields:[
        { key:'modules',   label:'全册目录或结构图', control:'textarea', ph:'可用文字、表格或结构图说明。' },
        { key:'find_way',  label:'使用者怎样找到所需资源', control:'textarea', ph:'说明使用者怎样依据章节、概念、目标或用途定位资源。' },
        { key:'why_org',   label:'为什么这样组织', control:'textarea', ph:'联系使用任务说明所选方式的作用及可能局限。' },
        { key:'comparison_objects', label:'选择比较的两个章节或两类资源', control:'text', ph:'例如：函数图像与三角函数、力学与电磁学资源。' },
        { key:'reuse',     label:'哪些结构可以共用，哪些差异需要保留，为什么', control:'textarea', ph:'比较至少两类资源或模块，说明可共用的信息、规则或组件，以及不可统一的部分。' } ] },
      { id:'Q04', label:'每条资源记录什么', fields:[
        { key:'resource_fields', label:'共同信息及用途', control:'rows', addLabel:'添加一个记录项',
          cols:[ { k:'name', l:'记录什么', control:'text' },
                 { k:'reason', l:'用来做什么', control:'text' },

  if (p.type === 'field')   { const i = QINDEX[p.q]; let f = i && i.q.fields.find(x => x.key === p.field); let ownerQ = i && i.q; if (!f) { for (const qi of Object.values(QINDEX)) { f = qi.q.fields.find(x => x.key === p.field); if (f) { ownerQ = qi.q; break; } } } return secLabel(ownerQ ? ownerQ.id : p.q) + ' · ' + (f && ownerQ ? fLabel(ownerQ, f) : p.field); }

  else if (how === 'both') { const joiner = document.getElementById(kid(key))?.tagName === 'TEXTAREA' ? '\n' : '；';
    const merged = (c.theirs && c.mine && c.theirs !== c.mine)
    ? c.theirs + joiner + c.mine : (c.mine || c.theirs);

function ctl (key, f, over = {}) {

  const c = f.control;
  if (c === 'textarea') return `<textarea ${common} rows="2"
      placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`;
  if (c === 'text') return `<input type="text" ${common} value="${esc(val)}" placeholder="${esc(f.ph || '')}">`;
  if (c === 'date') return `<input type="date" ${common} value="${esc(val)}">`;
  if (c === 'integer') return `<input type="number" min="0" ${common} value="${esc(val)}" placeholder="${esc(f.ph || '')}">`;
  if (c === 'select') return `<select ${common} class="${val ? '' : 'empty'}">
      <option value="">${esc(over.placeholder || '请选择')}</option>
      ${f.options.map(o => `<option value="${esc(o.v)}" ${val === o.v ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}
    </select>`;
  if (c === 'member_select') {
    const ms = members(), extra = val && ms.indexOf(val) < 0 ? [val] : [];
    return `<select ${common} class="${val ? '' : 'empty'}">
      <option value="">未选择</option>
      ${ms.concat(extra).map(m => `<option value="${esc(m)}" ${val === m ? 'selected' : ''}>${esc(m)}${ms.indexOf(m) < 0 ? '（名单外）' : ''}</option>`).join('')}
    </select>`;
  }
  if (c === 'function_select') {
    const opts = ['整体平台'].concat(cardsOf('functions').map(id2 => id2 + ' ' + (get('functions.' + id2 + '.name') || '未命名功能')));
    return `<select ${common} class="${val ? '' : 'empty'}"><option value="">请选择检查对象</option>
      ${opts.map(o => `<option ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if (c === 'version_select') {
    const vs = [...new Set([get('project.platform_version')].concat(db.snaps.map(s => s.platformVersion)).filter(Boolean))];
    return `<select ${common} class="${val ? '' : 'empty'}"><option value="">请确认所测版本</option>
      ${vs.map(v => `<option ${val === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}

        ${esc(cardLabelOf(t))}</label>`).join('')}</div>`;
  }
  return `<input type="text" ${common} value="${esc(val)}">`;
}
const cardLabelOf = t => { const [st, id] = t.split('.');

const cellKey = (block, rowId, col) => block + '#' + rowId + '.' + col;

    <div class="hint" style="margin-top:6px">对方写的：${esc(cf.theirs).slice(0, 120) || '（空）'}</div></div>`;

function summaryChips (q, id) {

  if (q.store === 'functions') {

    return `<b class="${name ? '' : 'untitled'}">${esc(name || '未命名功能')}</b>

const ownerCls = key => get(key + '.owner') ? 's2' : 'none';
const STATUS_TAG = { planned:['s1', '还没做'], doing:['s2', '正在做'], made:['s3', '已做出'], skip:['s0', '暂不做'] };

  const [c, l] = STATUS_TAG[v] || ['s0', v]; return `<span class="tag ${c}">${esc(l)}</span>`; }

function resultTag (v) { if (!v) return `<span class="tag none">结果未选择</span>`;
  const [c, l] = RESULT_TAG[v] || ['s0', v]; return `<span class="tag ${c}">${esc(l)}</span>`; }

function cardFieldView (q, id, f) {
  const key = q.store + '.' + id + '.' + f.key;
  const lab = `<label for="${kid(key)}">${esc(fLabel(q, f))}${f.optional ? '<span class="opt">（选填）</span>' : ''}</label>`;

    return `<details class="dis"><summary>${esc(f.disclosure)}</summary><div style="padding-top:8px">

/* 选择「尚未测试」而实际结果已有内容 → 提示处理矛盾，不静默删除 */
const pendingResult = {};

function withData (data, fn) {
  /* 个人作答不随展示版冻结：只换入小组内容 */
  const keys = ['atoms', 'rows', 'cards', 'materials', 'refs', 'decisions'], backup = {};
  keys.forEach(k => backup[k] = db[k]);
  keys.forEach(k => db[k] = JSON.parse(JSON.stringify(data[k] == null ? blankDb()[k] : data[k])));
  try { fn(); } finally { keys.forEach(k => db[k] = backup[k]); }
}

/* ============================================================
   导出层：Markdown 与 JSON 读取同一份已保存内容
   ============================================================ */
const val = k => { const t = String(get(k)).trim(); return t || NODATA; };
const valOr = (k, alt) => { const t = String(get(k)).trim(); return t || (alt || NODATA); };
const zhOpt = (f, v) => { const o = (f.options || []).find(x => x.v === v); return o ? o.l : (v || NODATA); };

function exportText (src, fmt) {
  const snap = src === 'draft' ? null : snapshotOf(src);
  let out = '';
  const legacy = snap && !snap.promptSchemaVersion;
  activeSnapLabels = legacy ? LABELS_V1 : null;
  withData(snap ? snap.data : { atoms:db.atoms, rows:db.rows, cards:db.cards, materials:db.materials,
                               refs:db.refs, decisions:db.decisions }, () => {
    if (fmt === 'json') out = jsonOut(snap);
    else if (fmt === 'doc') out = docOut(snap);
    else out = mdOut(snap);
  });
  activeSnapLabels = null;
  return out;
}
function sourceLine (snap) {
  return snap ? `展示版 ${snap.code}（平台版本 ${snap.platformVersion}，保存于 ${fmtTime(snap.at)}）` : '当前工作稿（未保存为展示版的实时内容）';
}
function projVal (k) { return val('project.' + k); }

function mdOut (snap) {
  const L = [];
  L.push('# 第三周小组平台开发工作台 · 导出');
  L.push('');
  L.push(`- 导出内容：${sourceLine(snap)}`);
  L.push('- 数据性质：本机浏览器中实际填写的内容');
  L.push('- 记录人：本机互动码下自选的姓名，未经服务端认证，按未验证身份对待');
  L.push('- 教师端入口靠本机管理密码，文件被复制后这道门不成立');
  L.push(`- 导出时间：${fmtTime(now())}`);
  L.push(`- 实践对应：${CFG.sections.map(s => s.label + '＝' + CFG.practice[s.id]).join('；')}`);
  L.push('');
  L.push('## 小组与作品信息');
  CFG.project.forEach(f => L.push(`- ${f.label}：${f.control === 'members' ? members().join('、') : projVal(f.key)}`));
  L.push('');
  CFG.sections.forEach(sec => {
    L.push(`## 部分 ${sec.label}（${CFG.practice[sec.id]}）`);
    L.push('');
    sec.questions.forEach(q => {
      L.push(`### ${qLabel(q)}`);
      if (q.control === 'cards') {
        const list = cardsOf(q.store);
        if (!list.length) { L.push(''); L.push('（本部分尚未添加记录）'); L.push(''); return; }
        list.forEach(id => {
          const key = q.store + '.' + id;
          L.push('');
          q.fields.forEach(f => {
            const k = key + '.' + f.key;
            let shown;
            if (f.control === 'select') shown = f.noDefault && !get(k) ? NODATA + '（未选择）' : zhOpt(f, get(k));
            else if (f.key === 'status') shown = valOr(k, NODATA + '（学生自报，不代表测试结论）');
            else shown = val(k);
            L.push(`- ${fLabel(q, f)}：${shown}`);
          });
          L.push(`- ${q.store === 'functions' ? '功能编号' : q.store === 'scenarios' ? '情境编号' : q.store === 'decisions' ? '决定编号' : q.store === 'revisions' ? '修改编号' : '检查编号'}：${id}（平台生成）`);
          L.push(`- 关联材料：${refLine(key)}`);
          if (q.store === 'functions') L.push('- 说明：本条功能记录不提供测试结论，检查结果见「检查与改进」');
          if (q.store === 'checks') L.push('- 说明：检查记录独立于功能进度，「已实现」不等于测试通过');
          if (q.store === 'scenarios') L.push('- 说明：教学情境试用记录教学适用性，不自动推断学生学习效果提高');
          if (q.store === 'decisions') L.push('- 说明：关键选择记录，含 AI 建议处理与人工检查');
          if (q.store === 'revisions') L.push('- 说明：根据证据修改的记录，含复查计划与结果');
        });
        L.push('');
        /* Q07 嵌入的情境卡也要导出 */
        if (q.id === 'Q07' && q.scenarioFields) {
          const scenList = cardsOf('scenarios');
          if (scenList.length) {
            L.push('#### 教学用途试用');
            scenList.forEach(id => {
              const key = 'scenarios.' + id;
              L.push('');
              q.scenarioFields.forEach(f => {
                const k = key + '.' + f.key;
                let shown;
                if (f.control === 'select') shown = f.noDefault && !get(k) ? NODATA + '（未选择）' : zhOpt(f, get(k));
                else if (f.control === 'integer') shown = get(k) || NODATA;
                else shown = val(k);
                L.push(`- ${f.label}：${shown}`);
              });
              L.push(`- 情境编号：${id}（平台生成）`);
              L.push(`- 关联材料：${refLine(key)}`);
            });
            L.push('');
          }
        }
        /* Q08 补充字段 */
        if (q.id === 'Q08' && q.extraField) {
          const ef = q.extraField;
          L.push(`- ${ef.label}：${val(q.id + '.' + ef.key)}`);
          L.push('');
        }
        return;
      }
      (q.fields || []).forEach(f => {
        if (f.control === 'rows') {
          const rows = db.rows[q.id + '.' + f.key] || [];
          L.push('');
          if (!rows.length) { L.push(`- ${fLabel(q, f) || '（增行记录）'}：${NODATA}`); L.push(''); return; }
          L.push(`**${f.cols.map(c => c.l).join(' ｜ ')}**`);
          rows.forEach((r, i) => L.push(`${i + 1}. ${f.cols.map(c => val(cellKey(q.id + '.' + f.key, r._id, c.k))).join(' ｜ ')}`));
          L.push('');
          return;
        }
        const k = q.id + '.' + f.key;
        let shown = f.control === 'select' ? (f.noDefault && !get(k) ? NODATA : zhOpt(f, get(k)))
                : f.control === 'link_select' ? (get(k) ? get(k).split('、').map(cardLabelOf).join('；') : NODATA)
                : val(k);
        if (f.control === 'select' && !f.noDefault && !get(k)) shown = NODATA;
        L.push(`- ${fLabel(q, f)}${f.optional ? '（选填）' : ''}：${shown}`);
      });
      L.push(`- 关联材料：${refLine(q.id)}`);
      const cs = commentsOf(q.id);
      if (cs.length) { L.push(`- 讨论记录：${cs.length} 条（见文末）`); }
      L.push('');
    });
  });
  L.push('## 关键决定记录（工具栏）');
  if (!db.decisions.length) L.push('- 本窗口尚未通过工具栏记录决定。Q06 的关键选择已作为多记录卡片导出在上方。');
  db.decisions.forEach(x => {
    L.push('');
    L.push(`### ${x.id}｜记在：${x.target_label}`);
    L.push(`- 遇到了什么问题：${x.problem || NODATA}`);
    L.push(`- 最后决定怎样做：${x.decision || NODATA}`);
    L.push(`- 依据是什么：${x.reason || NODATA}`);
    L.push(`- 依据来自：${(x.sources || []).join('；') || NODATA}`);
    L.push(`- 当时还考虑过：${x.alternates || NODATA}`);
    L.push(`- 参与这次决定的人：${(x.participants || []).join('、') || NODATA}`);
    L.push(`- 打算怎么看出这个决定好不好：${x.check_plan || NODATA}`);
    L.push(`- 事件时间：${x.event_at || NODATA}｜记录时间：${fmtTime(x.at)}｜${decTiming(x).state}`);
    L.push(`- 谁记的：${x.by}｜来源：${x.src}｜窗口：${x.win}`);
  });
  if ((db.legacyDecisions || []).length)
    L.push('', `- 本机另有 ${db.legacyDecisions.length} 条早期版本留下的决定记录，字段结构与现在不同、无法挂到具体位置，因此没有列在上面，也不进展示版；需要清掉请用「清空本机内容」。`);
  L.push('');
  L.push('## 个人任务作答');
  L.push('- 个人作答属于个人：不冻结进小组展示版，本导出一律取本机当前记录。');
  if (!db.personal.length) L.push('- 本机没有个人作答记录。教师端「个人测量」里开放时间已到、挂靠本任务的测量才会出现在个人任务入口。');
  db.personal.forEach(p => {
    L.push('');
    L.push(`### ${p.id}｜${p.msr_name}（教师端登记 ${p.msr}）`);
    L.push(`- 谁写的：${p.by}｜作答状态：${p.state || '未选择'}｜实际完成方式：${p.solo_self || NODATA}`);
    L.push(`- 中断或未提交的情况：${p.note || NODATA}`);
    L.push(`- 记于：${fmtTime(p.at)}｜最后更新：${fmtTime(p.updated_at || p.at)}｜标记提交：${
      p.sent_at ? fmtTime(p.sent_at) + (p.state === '已提交作答' ? '（与当前状态一致）' : '（当前状态已改为' + (p.state || '未选择') + '）') : '未标记'}`);
    L.push('- 作答原文：');
    L.push(...String(p.answer || NODATA).split('\n').map(x => '    ' + x));
  });
  L.push('');
  L.push('## 材料索引');
  if (!db.materials.length) L.push('（本组尚未添加材料）');
  db.materials.forEach(m => {
    const used = Object.keys(db.refs).filter(t => (db.refs[t] || []).includes(m.id)).map(t => labelOf(t));
    L.push(`- ${m.id}｜${m.kind === 'file' ? '文件' : m.kind === 'link' ? '链接' : '粘贴片段'}｜${matName(m)}`);
    L.push(`  - 定位：${m.loc || NODATA}｜添加：${m.by} ${fmtTime(m.at)}｜文本提取：${m.extracted ? '已提取，正文随导出包提供' : '未提取'}`);
    L.push(`  - 被引用于：${used.length ? used.join('；') : NODATA}`);
  });
  L.push('');
  const withText = db.materials.filter(m => m.text);
  if (withText.length) {
    L.push('## 材料正文（已提取文本，随本导出包提供）');
    withText.forEach(m => {
      L.push('');
      L.push(`### ${m.id}｜${m.kind === 'file' ? '文件' : '粘贴片段'}｜${matName(m)}`);
      L.push(...m.text.split('\n').map(l => '    ' + l));
    });
    L.push('');
  }
  L.push('## 展示版记录');
  if (db.snaps.length) db.snaps.forEach(s => L.push(`- ${s.code}｜平台版本 ${s.platformVersion}｜${fmtTime(s.at)}｜${s.by}`));
  else L.push('- 尚未保存展示版');
  L.push('');
  L.push('## 编辑与提交记录（系统实际捕获到的行为）');
  if (snap) L.push('- 本导出取自展示版快照；快照不单独保存逐条编辑时间线，下面列出的是本机工作稿当前保留的编辑记录。');
  L.push('');
  L.push('- 分工与讨论分开记录：认领人不等于实际编辑人，讨论参与者单独保留。');
  L.push('- 以下条目按题目汇总最近编辑，仅说明系统捕获到的行为，不按字数或编辑次数折算个人贡献。');
  const byTarget = {};
  db.revisions.forEach(r => { (byTarget[r.label] || (byTarget[r.label] = [])).push(r); });
  Object.entries(byTarget).slice(0, 60).forEach(([lab, rs]) => {
    L.push(`  - ${lab}：最近 ${fmtTime(rs[0].at)}由 ${rs[0].by} 编辑，共记录 ${rs.length} 次改动`);
  });
  L.push('');
  L.push('## 操作记录');
  if (db.activity.length) db.activity.slice(0, 60).forEach(a => L.push(`- ${fmtTime(a.at)} ${a.by}：${a.text}`));
  else L.push('- 无');
  L.push('');
  L.push('## 讨论与留言');
  if (db.comments.length) db.comments.forEach(c => L.push(`- ${c.target && QINDEX[c.target] ? qLabel(QINDEX[c.target].q) : labelOf(c.target || '')}${c.replyTo ? '（回复）' : ''}｜${c.by}｜${fmtTime(c.at)}｜${c.text}`));
  else L.push('- 无');
  L.push('');
  L.push('## 导出说明');
  L.push('- 空内容一律保留为「未填写」，不由平台或AI补齐。');
  L.push('- 学生自报的开发进度与检查结果分开保存：「已做出」不自动生成测试通过结论。');
  L.push('- 外部链接不一定能被另一个AI读取；本包仅在标注「已提取」时附带文本，其余只提供名称与定位。');
  L.push('- 未随包提供或未提取文本的材料，本导出不声称已核验其内容。');
  L.push('- 字段编号（如 F01、T01、S01）与框架对应关系由平台维护，学生无需手工编号。');
  return mdJoin(L);
}
/* 学生原文可能含换行：续行统一缩进，避免被读成新的导出条目 */
function mdJoin (L) {
  const out = [];
  L.forEach(x => {
    if (x === '') { if (out.length && out[out.length - 1] !== '') out.push(''); return; }
    out.push(x.indexOf('\n') < 0 ? x : x.replace(/\n/g, '\n    '));
  });
  return out.join('\n');
}
function refLine (target) {
  const r = refsOf(target);
  return r.length ? r.map(id => { const m = db.materials.find(x => x.id === id); return id + (m ? '（' + matName(m) + '）' : ''); }).join('；') : '尚未添加';
}

function exportFileName (snap) {
  const base = (get('project.platform_name') || db.group.name).replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 28);
  const ext = ui.exportFmt === 'json' ? 'json' : ui.exportFmt === 'doc' ? 'html' : 'md';
  return `${base}-第三周-${snap ? snap.code : '工作稿'}.${ext}`;
}
function doDownload () {
  const snap = ui.exportSrc === 'draft' ? null : snapshotOf(ui.exportSrc);
  const text = exportText(ui.exportSrc, ui.exportFmt);
  const mime = ui.exportFmt === 'doc' ? 'text/html;charset=utf-8' : 'text/plain;charset=utf-8';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = exportFileName(snap);
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast('已下载 ' + a.download);
}

/* ---------- 导出开发说明（P5 专用，spec §六） ---------- */
function devSpecMarkdown (ids) {
  const L = [], v = k => val(k) || '（未填写）';
  const name = projVal('platform_name') || '（未填写）';
  L.push('# 开发说明 · ' + name);
  L.push('');
  L.push('## 项目信息');
  L.push('- 平台名称：' + name);
  L.push('- 学科与教材：' + (projVal('subject') || '（未填写）'));
  const tu = projVal('teaching_use');
  const tuOpt = CFG.project.find(f => f.key === 'teaching_use');
  const tuLabel = tuOpt ? (tuOpt.options.find(o => o.v === tu) || {}).l || '（未选择）' : '（未选择）';
  L.push('- 主要教学用途：' + tuLabel);
  if (tu === 'other') L.push('- 用途补充：' + (projVal('teaching_use_note') || '（未填写）'));
  L.push('');
  L.push('## 使用者及任务');
  L.push('- 谁在什么情况下使用：' + v('Q01.audience'));
  L.push('- 要完成什么学习任务：' + v('Q01.user_task'));
  L.push('- 本周先完成哪些任务：' + v('Q02.scope'));
  const basis = v('Q01.demand_basis');
  if (basis !== '（未填写）') L.push('- 判断依据：' + basis);
  L.push('');
  L.push('## 资源结构');
  const modules = v('Q03.modules');
  if (modules !== '（未填写）') L.push(modules.split('\n').map(x => '> ' + x).join('\n'));
  const rfRows = db.rows['Q04.resource_fields'] || [];
  if (rfRows.length) {
    L.push('');
    L.push('**资源字段表**');
    rfRows.forEach((r, i) => {
      const n = val(cellKey('Q04.resource_fields', r._id, 'name'));
      const u = val(cellKey('Q04.resource_fields', r._id, 'reason'));
      L.push('- ' + (n || '（未填）') + '：' + (u || '（未填）'));
    });
  }
  L.push('');
  if (!ids.length) { L.push('## 本次实现的功能'); L.push('（未选择任何功能）'); }
  else {
    L.push('## 本次实现的功能');
    ids.forEach(id => {
      const k = 'functions.' + id;
      L.push('');
      L.push('### ' + (get(k + '.name') || '未命名功能') + '（' + id + '）');
      L.push('- 使用者输入或选择什么：' + (get(k + '.user_action') || '（未填写）'));
      L.push('- 平台读取什么信息：' + (get(k + '.data_inputs') || '（未填写）'));
      L.push('- 按什么条件或步骤处理：' + (get(k + '.processing') || '（未填写）'));
      L.push('- 输出什么结果：' + (get(k + '.output') || '（未填写）'));
      const owner = get(k + '.owner') || '（未填写）';
      const status = get(k + '.status');
      const stOpt = CFG.sections.find(s=>s.id==='functions').questions[0].fields.find(f=>f.key==='status').options;
      const stLabel = status ? ((stOpt.find(o=>o.v===status)||{}).l || status) : '（未选择）';
      L.push('- 负责人：' + owner);
      L.push('- 开发进度：' + stLabel);
      const ta = get(k + '.task_alignment');
      if (ta) L.push('- 支持哪项学习任务：' + ta);
    });
  }
  L.push('');
  L.push('## 整合安排');
  L.push(v('Q02.integration'));
  L.push('');
  const missing = [];
  ids.forEach(id => {
    const k = 'functions.' + id;
    const nm = get(k + '.name') || '未命名功能';
    ['user_action','data_inputs','processing','output'].forEach(fk => {
      if (!get(k + '.' + fk)) missing.push(nm + ' → ' + (CFG.sections.find(s=>s.id==='functions').questions[0].fields.find(f=>f.key===fk)||{}).label || fk);
    });
  });
  if (missing.length) {
    L.push('## 待确认内容');
    missing.forEach(m => L.push('- ' + m));
  } else if (ids.length) {
    L.push('## 待确认内容');
    L.push('所选功能的必填字段均已填写。');
  }
  L.push('');
  L.push('---');
  L.push('导出时间：' + fmtTime(now()) + '  记录人：' + (ME || '未登录'));
  return L.join('\n');
}

/* 输入只写数据、不整页重渲染，避免打断光标 */
document.addEventListener('input', e => {
  const el = e.target, dc = el.dataset && el.dataset.dc;
  /* 互动码：一位一格，输满自动跳到下一格，不参与数据写入 */
  if (el.classList && el.classList.contains('code')) {
    el.value = el.value.replace(/\s/g, '').slice(-1);
    if (el.value) { const box = el.closest('.codes'), all = box ? [...box.querySelectorAll('input')] : [];
      const i = all.indexOf(el); if (i >= 0 && i < all.length - 1) all[i + 1].focus(); }
    return;
  }
  /* 决定记录与个人作答：未提交的内容先暂存在内存，重渲染后回填 */
  if (dc) {
    const i = dc.indexOf('|'), k = dc.slice(0, i), f = dc.slice(i + 1);
    (ui.decDraft[k] || (ui.decDraft[k] = {}))[f] = el.value;
    if (el.tagName === 'TEXTAREA') { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 520) + 'px'; }
    return;
  }
  const k = el.dataset && el.dataset.k;
  if (!k) return;
  if (teacherMode() || !ME) return;                     // 教师通道与未登录都不改学生内容
  myDraft = el.value;
  put(k, el.value);
  if (el.tagName === 'TEXTAREA') { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 520) + 'px'; }
  syncSummary(k);
});
document.addEventListener('focusin', e => {
  const k = e.target && e.target.dataset && e.target.dataset.k;
  if (!k) return;
  focusKey = k; focusAt = now(); myDraft = get(k); announce(k);
});
document.addEventListener('focusout', e => {
  const k = e.target && e.target.dataset && e.target.dataset.k;
  if (k && k === focusKey) { focusKey = null; if (!conflicts[k]) snapshotBeforeRemote[k] = db.atoms[k]; }
});
/* 卡片摘要随输入更新 */
function syncSummary (key) {
  const p = parseKey(key);
  if (p.type !== 'card') return;
  const d = document.querySelector(`details[data-toggle="${p.store}.${p.id}"] > summary`);
  if (!d) return;

/* 下拉与勾选需要重渲染（影响禁用态、摘要与选项） */
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'export-src') { ui.exportSrc = el.value; render(); return; }
  if (el.dataset.devspecId) {
    const id = el.dataset.devspecId;

  }
  if (teacherMode() || !ME) return;                     // 只有登录的学生本人能改内容
  if (el.dataset.dc) {
    const i = el.dataset.dc.indexOf('|'), k = el.dataset.dc.slice(0, i), f = el.dataset.dc.slice(i + 1);
    (ui.decDraft[k] || (ui.decDraft[k] = {}))[f] = el.value; return;
  }
  if (el.dataset.dcGroup) {

    if (p.type === 'card' && p.field === 'result' && el.value === 'not_tested' && get(p.store + '.' + p.id + '.actual').trim()) {

    el.checked ? cur.add(el.dataset.t) : cur.delete(el.dataset.t);

  if (el.dataset.mat === 'file') { handleFile(el); return; }
});

    case 'demo-clear': if (confirm('清空本机内容？展示版快照与编辑记录会一并删除。')) {
        localStorage.removeItem(DB_KEY); db = blankDb(); logout(); sessCodeOk(machineClass() || '科教班');
        applyProjectSeed(); snapshotBeforeRemote = JSON.parse(JSON.stringify(db.atoms));
        ui.section = 'users'; ui.panel = null; ui.decDraft = {}; save(); render(); toast('已清空，请重新选名字'); } break;
    case 'join-save': {
      const cls = d.cls || '科教班';
      const c = readCode('j-' + cls);
      if (c.length < CODE_LEN) { ui.login = { cls, err:'请填写完整的 4 位互动码' }; render(); break; }
      setJoin(c, cls); ui.login = { cls }; render(); toast(cls + ' 互动码已更新为 ' + c); break; }
  }
});
/* details 收起状态只记在内存，不入库 */
document.addEventListener('toggle', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('rec') && t.dataset.toggle) ui.closed[t.dataset.toggle] = !t.open;
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.modal) { ui.modal = null; render(); }
  if (e.key === 'Enter' && e.target && e.target.classList && (e.target.classList.contains('code') || e.target.classList.contains('pw'))) {
    const go = document.querySelector('.gate .go'); if (go) { e.preventDefault(); go.click(); }
  }
});
function applyResultChoice (store, id, how) {
  const key = store + '.' + id, p = pendingResult[key]; if (!p) return;
  if (how === 'cancel') { delete pendingResult[key]; render(); return; }
  if (how === 'keep') { put(key + '.result', 'unmet', { source:'确认检查结果', resolve:true }); }
  if (how === 'move') {
    const actual = get(key + '.actual'), nextKey = key + '.next_action';
    put(nextKey, (get(nextKey) ? get(nextKey) + '\n' : '') + '（由尚未测试的检查记录转入）' + actual, { source:'保留实际结果', resolve:true });
    db.atoms[key + '.actual'] = { text:'', by:ME, at:now() };
    db.revisions.unshift({ id:'R' + (++db.seq.R), key:key + '.actual', label:labelOf(key + '.actual'), prev:actual, next:'', by:ME, at:now(), count:1 });
    put(key + '.result', 'not_tested', { source:'切换检查状态', resolve:true });
  }
  if (how === 'clear') {
    const actual = get(key + '.actual');
    db.atoms[key + '.actual'] = { text:'', by:ME, at:now() };
    db.revisions.unshift({ id:'R' + (++db.seq.R), key:key + '.actual', label:labelOf(key + '.actual'), prev:actual, next:'', by:ME, at:now(), count:1 });
    put(key + '.result', 'not_tested', { source:'切换检查状态', resolve:true });
  }
  delete pendingResult[key]; logActivity('处理检查状态与实际结果的矛盾：' + cardTitle(store, id));
  save(); render();
}
function addLinkMat (btn) {
  const inp = document.getElementById('ml-' + btn.dataset.t);
  if (!inp || !inp.value.trim()) { toast('请先粘贴链接或位置'); return; }
  attachMat(btn.dataset.t, addMaterial({ kind:'link', url:inp.value.trim(), name:inp.value.trim() }));
  render();
}
function addPasteMat (t) {
  const inp = document.getElementById('mp-' + t), loc = document.getElementById('mq-' + t);
  if (!inp || !inp.value.trim()) { toast('请先粘贴原始片段'); return; }
  const text = inp.value.trim();
  attachMat(t, addMaterial({ kind:'paste', name:text.slice(0, 24) + '…', text,
    loc:loc ? loc.value.trim() : '', extracted:true }));
  render();
}
function handleFile (el) {
  const f = el.files && el.files[0], t = el.dataset.t;
  if (!f) return;
  const isText = /\.(md|markdown|txt|json|csv)$/i.test(f.name);
  if (isText && f.size < 400000) {
    const r = new FileReader();
    r.onload = () => { const sid = addMaterial({ kind:'file', name:f.name, text:String(r.result || '').slice(0, 60000), extracted:true });
      attachMat(t, sid); render(); toast('已读取文本：' + f.name); };
    r.onerror = () => toast('文件读取失败，可改为只记录文件名与位置');
    r.readAsText(f);
  } else {
    const sid = addMaterial({ kind:'file', name:f.name, extracted:false,
      loc:isText ? '超出 400KB，未提取文本' : '非文本文件，未提取文本' });
    attachMat(t, sid); render();
    toast('未上传文件本体，已记录文件名与定位；导出时会标注「未提取文本」');
  }
}


/* ============================================================
   启动
   ============================================================ */
/* 调试访问器：供验收自测核对协作状态（只读，不影响界面） */
window.__dbg = () => ({ me:ME, tab:TAB, sess:readSess(), assigned:!!db.group.assigned,
  groupNo:db.group.groupNo, joinFp:joinFp(), passSet:passState(), focusKey, conflicts:Object.keys(conflicts),
  presence:freshPresence().map(p => p.by + '→' + p.key), rev:db._rev, snaps:db.snaps.length });

function boot () {
  localStorage.removeItem(ME_KEY);          // 旧版本把身份存在本机共享键里，界面自选身份已废除
  /* 上一版「自设班级码」的校验值搬到互动码键，教师换过码的机器不丢 */
  const oldClass = readDigest(CLASS_KEY);
  if (oldClass && !readDigest(JOIN_KEY)) { localStorage.setItem(JOIN_KEY, JSON.stringify(oldClass)); }
  localStorage.removeItem(CLASS_KEY);
  const had = load();
  if (!had) { db = blankDb(); save(true); }
  applyProjectSeed();
  /* 两扇门凭据层：教师门在管理密码被清掉时作废；学生门的互动码指纹对不上时作废 */
  const s = readSess();
  if (s.door === 'teacher' && !passState()) clearSess();
  else if (s.code && s.jk !== joinFp()) clearSess();
  snapshotBeforeRemote = JSON.parse(JSON.stringify(db.atoms));
  applySess();
  if (ME && db.group.assigned && groupOf(ME) !== db.group.groupNo) { sessCodeOk(); ME = ''; }
  if (isTeacher() && ui.view === 'workbench') ui.view = 'teacherGroups';
  render();
  setSaveState('saved');
}
boot();
/* 在线标记 9 秒过期：聚焦期间每 5 秒重新广播位置，并只刷新在线与冲突片段 */
setInterval(() => { if (focusKey) announce(focusKey); refreshPresence(); }, 5000);
/* 页面离开前把尚未落盘的输入写入；无改动时不回写，避免覆盖其他标签页的新内容 */
window.addEventListener('beforeunload', () => { if (dirty) { clearTimeout(saveTimer); save(); } });
</script>
